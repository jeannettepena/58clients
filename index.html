<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Properties &amp; Clients — The 58 Group</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --navy:#1F2A44;
    --navy-light:#2E3E63;
    --gold:#B8963E;
    --gold-light:#EFE3C2;
    --cream:#FAF8F4;
    --paper:#FFFFFF;
    --ink:#1F1F1F;
    --muted:#6B7280;
    --line:#E7E2D6;
    --green-bg:#E7F3EA; --green-tx:#1B6E3A;
    --amber-bg:#FBF1DA; --amber-tx:#8A6413;
    --grey-bg:#EEEFF1; --grey-tx:#555555;
    --red-bg:#F7ECEC; --red-tx:#9C3B3B;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:"Georgia","Iowan Old Style",serif; background:var(--cream); color:var(--ink); }
  .ui{ font-family:Arial, Helvetica, sans-serif; }

  header{ background:linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%); color:#fff; padding:34px 6vw 30px; position:relative; text-align:center; }
  header .logo-mark{ display:block; margin:0 auto 22px; height:52px; }
  header h1{ margin:0 0 6px; font-size:32px; font-weight:400; letter-spacing:.01em; }
  header h1 em{ font-style:italic; color:var(--gold-light); }
  header .subline{ font-family:Arial, sans-serif; letter-spacing:.14em; text-transform:uppercase; font-size:10.5px; color:#B9C2D6; margin-top:2px; }
  #syncStatus{ font-family:Arial, sans-serif; font-size:11.5px; color:#B9C2D6; position:absolute; top:34px; right:6vw; }
  #syncStatus.err{ color:#F3B9B9; }

  .view-tabs-wrap{ background:var(--paper); border-bottom:1px solid var(--line); }
  .view-tabs{ display:flex; gap:30px; padding:0 6vw; max-width:1180px; margin:0 auto; }
  .view-tab{ font-family:Arial, sans-serif; font-size:13px; font-weight:600; letter-spacing:.01em; padding:16px 2px 13px; border:none; border-bottom:2px solid transparent; background:transparent; color:var(--muted); cursor:pointer; }
  .view-tab.active{ color:var(--navy); border-bottom-color:var(--gold); font-weight:700; }

  .upcoming-panel{ margin:24px 6vw 0; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:18px 20px; }
  .upcoming-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
  .upcoming-title{ font-family:Arial, sans-serif; font-size:14px; font-weight:700; color:var(--navy); letter-spacing:.02em; }
  .upcoming-title .upcoming-count{ font-family:Arial, sans-serif; font-size:11px; font-weight:700; background:var(--gold-light); color:#6B5423; padding:2px 8px; border-radius:10px; margin-left:8px; vertical-align:middle; }
  .upcoming-window-label{ font-family:Arial, sans-serif; font-size:12px; color:var(--muted); }
  .upcoming-window-label select{ font-family:Arial, sans-serif; font-size:12px; border:1px solid var(--line); border-radius:6px; padding:5px 7px; color:var(--ink); background:#fff; margin-left:4px; }
  .upcoming-empty{ font-family:Arial, sans-serif; font-size:12.5px; color:var(--muted); font-style:italic; padding:6px 0 2px; }
  .upcoming-list{ display:flex; flex-direction:column; gap:6px; }
  .upcoming-row{
    display:flex; align-items:center; gap:10px; font-family:Arial, sans-serif; font-size:12.5px; color:var(--ink);
    background:var(--cream); border:1px solid var(--line); border-radius:8px; padding:9px 12px; cursor:pointer; transition:border-color .12s ease;
  }
  .upcoming-row:hover{ border-color:var(--gold); }
  .upcoming-row .up-icon{ font-size:15px; flex:0 0 auto; }
  .upcoming-row .up-label{ flex:0 0 auto; font-weight:700; color:var(--navy); white-space:nowrap; }
  .upcoming-row .up-name{ flex:1 1 auto; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .upcoming-row .up-sub{ flex:1 1 auto; color:var(--muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .upcoming-row .up-date{ flex:0 0 auto; color:var(--muted); white-space:nowrap; }
  .upcoming-row .up-days{ flex:0 0 auto; font-weight:700; font-size:11px; padding:4px 9px; border-radius:12px; white-space:nowrap; background:var(--grey-bg); color:var(--grey-tx); }
  .upcoming-row .up-days.soon{ background:var(--amber-bg); color:var(--amber-tx); }
  .upcoming-row .up-days.urgent{ background:var(--red-bg); color:var(--red-tx); }
  .upcoming-toggle{ font-family:Arial, sans-serif; font-size:12px; font-weight:600; color:var(--navy); background:none; border:none; cursor:pointer; padding:8px 0 0; text-decoration:underline; }
  @media (max-width:820px){
    .upcoming-row{ flex-wrap:wrap; }
    .upcoming-row .up-sub{ order:5; flex-basis:100%; }
  }

  .stats{ display:flex; flex-wrap:wrap; gap:14px; padding:24px 6vw 0; }
  .stat-card{ font-family:Arial, sans-serif; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:15px 18px; min-width:120px; flex:1 1 130px; box-shadow:0 1px 2px rgba(31,42,68,0.04); }
  .stat-card .num{ font-size:24px; font-weight:700; color:var(--navy); line-height:1; }
  .stat-card .lbl{ margin-top:6px; font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .stat-card.tone-green .num{ color:var(--green-tx); }
  .stat-card.tone-amber .num{ color:var(--amber-tx); }
  .stat-card.tone-grey .num{ color:var(--grey-tx); }
  .stat-card.tone-red .num{ color:var(--red-tx); }

  .quickviews{ font-family:Arial, sans-serif; margin:16px 6vw 0; display:flex; gap:8px; flex-wrap:wrap; }
  .qv-btn{ font-size:12px; font-weight:700; padding:8px 14px; border-radius:20px; border:1px dashed var(--gold); background:#fff; color:#6B5423; cursor:pointer; white-space:nowrap; }
  .qv-btn:hover{ background:var(--gold-light); }
  .qv-btn.active{ background:var(--gold); border-style:solid; color:#fff; }

  .controls{ font-family:Arial, sans-serif; margin:18px 6vw 0; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .controls-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn-pill{ font-family:Arial, sans-serif; font-size:12.5px; font-weight:700; padding:10px 16px; border-radius:8px; cursor:pointer; white-space:nowrap; border:1px solid var(--line); background:#fff; color:var(--navy); }
  .btn-pill:hover{ border-color:var(--navy); }
  .btn-pill.primary{ background:var(--navy); border-color:var(--navy); color:#fff; }
  .btn-pill.primary:hover{ background:var(--navy-light); }
  #importFileInput{ display:none; }
  .search-wrap{ position:relative; flex:1 1 280px; }
  #search{
    width:100%; padding:11px 14px 11px 38px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:Arial, sans-serif;
    background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%236B7280' stroke-width='2'><circle cx='6.5' cy='6.5' r='5.5'/><line x1='10.5' y1='10.5' x2='15' y2='15'/></svg>") no-repeat 12px center;
    color:var(--ink);
  }
  #search:focus{ outline:none; border-color:var(--gold); }

  .filter-row{ display:flex; gap:8px; flex-wrap:wrap; margin:14px 6vw 0; font-family:Arial, sans-serif; align-items:center; }
  .filter-row .grp-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-right:2px; }
  .filter-btn{
    font-family:Arial, sans-serif; font-size:12.5px; font-weight:600; padding:8px 13px; border-radius:20px; border:1px solid var(--line);
    background:#fff; color:var(--muted); cursor:pointer; transition:all .12s ease; white-space:nowrap;
  }
  .filter-btn:hover{ border-color:var(--navy); color:var(--navy); }
  .filter-btn.active{ background:var(--navy); border-color:var(--navy); color:#fff; }

  .result-count{ font-family:Arial, sans-serif; margin:16px 6vw 6px; font-size:12.5px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .sort-select{ font-family:Arial, sans-serif; font-size:12.5px; border:1px solid var(--line); border-radius:6px; padding:6px 8px; color:var(--ink); background:#fff; }

  .list{ margin:0 6vw 60px; display:flex; flex-direction:column; gap:10px; }
  .card{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:16px 20px; }
  .card.jasso{ border-left:4px solid var(--gold); }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; margin-bottom:10px; }
  .col-prop .addr{ font-size:15.5px; color:var(--navy); font-weight:600; }
  .col-prop .meta{ font-family:Arial, sans-serif; font-size:12px; color:var(--muted); margin-top:3px; }
  .col-prop .datebadge{ font-family:Arial, sans-serif; font-size:11.5px; color:#8A6413; margin-top:4px; }
  .col-prop .datebadge.lease-warn{ color:var(--red-tx); font-weight:700; }
  .col-prop .datebadge.lease-missing{ color:var(--muted); font-style:italic; }
  .card-top-right{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end; max-width:60%; }

  .role-pill{ display:inline-block; font-family:Arial, sans-serif; font-size:11px; font-weight:700; padding:4px 10px; border-radius:14px; background:var(--gold-light); color:#6B5423; white-space:nowrap; }
  .type-pills{ display:flex; gap:4px; flex-wrap:wrap; }

  .owners{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .owner-block{ background:var(--cream); border:1px solid var(--line); border-radius:8px; padding:10px 13px; }
  .owner-block.empty{ display:flex; align-items:center; justify-content:center; color:var(--muted); font-style:italic; font-size:12.5px; font-family:Arial, sans-serif; }
  .owner-block .o-label{ font-family:Arial, sans-serif; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:4px; }
  .owner-block .o-name{ font-family:Arial, sans-serif; font-size:14px; font-weight:700; color:var(--ink); }
  .owner-block .o-line{ font-family:Arial, sans-serif; font-size:12.5px; color:var(--ink); margin-top:3px; }
  .owner-block .o-line a{ color:var(--navy); text-decoration:none; }
  .owner-block .o-line a:hover{ text-decoration:underline; }
  .owner-block .o-bday{ font-family:Arial, sans-serif; font-size:12px; color:#8A6413; margin-top:3px; }
  .owner-block .o-bday::before{ content:"🎂 "; }

  .note-row{ font-family:Arial, sans-serif; font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.4; }
  .note-row.repeat{ color:#8A6413; font-weight:700; }

  .followup-row{ font-family:Arial, sans-serif; font-size:11.5px; color:var(--muted); margin-top:10px; display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  .followup-pill{ font-weight:700; padding:3px 9px; border-radius:12px; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; }

  .badge{ font-family:Arial, sans-serif; display:inline-block; font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; padding:5px 11px; border-radius:20px; white-space:nowrap; }
  .badge.tone-green{ background:var(--green-bg); color:var(--green-tx); }
  .badge.tone-amber{ background:var(--amber-bg); color:var(--amber-tx); }
  .badge.tone-grey{ background:var(--grey-bg); color:var(--grey-tx); }
  .badge.tone-red{ background:var(--red-bg); color:var(--red-tx); }
  .badge.tone-navy{ background:var(--navy); color:#fff; }
  .badge.tone-gold{ background:var(--gold); color:#fff; }
  .badge.tone-gold2{ background:var(--gold-light); color:#6B5423; }
  .badge.tone-grey-dark{ background:#E3E1DA; color:#7A7568; }

  .edit-btn{ font-family:Arial, sans-serif; font-size:12px; font-weight:600; color:var(--navy); background:#fff; border:1px solid var(--line); padding:7px 12px; border-radius:6px; cursor:pointer; white-space:nowrap; }
  .edit-btn:hover{ border-color:var(--navy); }
  .log-toggle-btn{ font-family:Arial, sans-serif; font-size:11.5px; font-weight:600; color:var(--muted); background:none; border:none; text-decoration:underline; cursor:pointer; padding:0; margin-top:8px; }

  .activity-log{ margin-top:12px; border-top:1px dashed var(--line); padding-top:12px; font-family:Arial, sans-serif; }
  .activity-entry{ font-size:12px; padding:8px 10px; background:var(--cream); border-radius:6px; margin-bottom:6px; }
  .activity-entry .ae-head{ display:flex; justify-content:space-between; gap:8px; font-weight:700; color:var(--navy); }
  .activity-entry .ae-body{ color:var(--ink); margin-top:2px; }
  .activity-entry .ae-diff{ color:var(--muted); font-style:italic; margin-top:2px; }
  .activity-empty{ font-size:12px; color:var(--muted); font-style:italic; }
  .log-add-row{ display:grid; grid-template-columns:1fr 2fr 1fr auto; gap:8px; margin-top:10px; align-items:end; }
  .log-add-row label{ display:block; font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
  .log-add-row input, .log-add-row select, .log-add-row textarea{ width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:12.5px; font-family:Arial, sans-serif; }
  @media (max-width:900px){ .log-add-row{ grid-template-columns:1fr; } }

  .card.editing{ background:#FCFAF5; border-color:var(--gold); }
  .edit-form{ font-family:Arial, sans-serif; }
  .edit-form .addr-label{ font-size:14px; font-weight:700; color:var(--navy); margin-bottom:14px; }
  .edit-section{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:14px; }
  .edit-section .es-title{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:10px; }
  .owner-edit-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:14px; }
  .owner-edit{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .owner-edit .oe-title{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:10px; }
  .edit-form label{ display:block; font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; margin-top:8px; }
  .edit-form label:first-of-type{ margin-top:0; }
  .edit-form input, .edit-form select, .edit-form textarea{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px; font-family:Arial, sans-serif; color:var(--ink); background:#fff;
  }
  .edit-form input:disabled, .edit-form select:disabled{ background:var(--grey-bg); color:var(--muted); }
  .edit-form textarea{ resize:vertical; min-height:40px; }
  .checkbox-grid{ display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; }
  .checkbox-pill{ font-family:Arial, sans-serif; font-size:12px; display:flex; align-items:center; gap:5px; background:var(--cream); border:1px solid var(--line); border-radius:16px; padding:5px 11px; cursor:pointer; }
  .checkbox-pill input{ width:auto; margin:0; }
  .override-row{ display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--muted); margin-top:6px; }
  .override-row input{ width:auto; }
  .auto-hint{ font-size:11px; font-style:italic; color:var(--muted); margin-top:4px; }
  .lease-edit-row{ background:#FFF9EC; border:1px solid #E1CE93; border-radius:8px; padding:12px 14px; margin-bottom:14px; }
  .lease-edit-row .oe-title{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:#8A6413; margin-bottom:10px; }
  .lease-est-hint{ font-family:Arial, sans-serif; font-size:10.5px; font-style:italic; color:var(--muted); margin-top:4px; line-height:1.4; }
  .lease-edit-grid, .edit-grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .edit-grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  .bottom-row{ display:grid; grid-template-columns:1fr 2fr; gap:14px; margin-bottom:14px; }
  .edit-actions{ display:flex; gap:10px; justify-content:flex-end; align-items:center; }
  .save-confirm{ font-size:12px; color:var(--green-tx); font-weight:700; opacity:0; transition:opacity .2s ease; }
  .save-confirm.show{ opacity:1; }
  .btn-save{ font-family:Arial, sans-serif; font-size:13px; font-weight:700; background:var(--navy); color:#fff; border:none; padding:9px 18px; border-radius:6px; cursor:pointer; }
  .btn-save:hover{ background:var(--navy-light); }
  .btn-cancel{ font-family:Arial, sans-serif; font-size:13px; font-weight:600; background:#fff; color:var(--muted); border:1px solid var(--line); padding:9px 18px; border-radius:6px; cursor:pointer; }
  .validation-note{ font-family:Arial, sans-serif; font-size:12px; background:var(--amber-bg); color:var(--amber-tx); border-radius:6px; padding:8px 12px; margin-bottom:12px; }

  .empty-state{ font-family:Arial, sans-serif; text-align:center; padding:50px 20px; color:var(--muted); }
  .loading{ font-family:Arial, sans-serif; text-align:center; padding:60px 20px; color:var(--muted); }
  footer{ font-family:Arial, sans-serif; text-align:center; padding:24px; font-size:11.5px; color:var(--muted); border-top:1px solid var(--line); }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--navy); color:#fff;
    font-family:Arial, sans-serif; font-size:13px; font-weight:600; padding:12px 20px; border-radius:8px; opacity:0; pointer-events:none;
    transition:all .25s ease; z-index:100;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.err{ background:var(--red-tx); }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(31,42,68,0.45); display:flex; align-items:center; justify-content:center; z-index:200; }
  .modal-box{ font-family:Arial, sans-serif; background:#fff; border-radius:10px; padding:24px; max-width:420px; width:90%; box-shadow:0 10px 40px rgba(0,0,0,0.25); }
  .modal-box h3{ margin:0 0 10px; color:var(--navy); font-size:16px; }
  .modal-box p{ margin:0 0 18px; color:var(--ink); font-size:13.5px; line-height:1.5; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; }

  .thelist-filters{ display:flex; gap:8px; flex-wrap:wrap; margin:26px 6vw 16px; font-family:Arial, sans-serif; align-items:center; }
  .thelist-count{ margin:0 6vw 10px; font-family:Arial, sans-serif; font-size:12px; color:var(--muted); }
  .thelist-table{ margin:0 6vw 60px; border-collapse:collapse; width:calc(100% - 12vw); font-family:Arial, sans-serif; font-size:12.5px; background:#fff; }
  .thelist-table th{ background:var(--navy); color:#fff; text-align:left; padding:10px 10px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  .thelist-table td{ padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  .thelist-table tr:hover td{ background:#FCFAF5; }
  .thelist-table select{ font-family:Arial, sans-serif; font-size:11.5px; padding:5px 6px; border:1px solid var(--line); border-radius:5px; }
  .thelist-link{ font-family:Arial, sans-serif; font-size:11.5px; font-weight:700; color:var(--navy); background:none; border:none; text-decoration:underline; cursor:pointer; padding:0; }
  .thelist-actions{ display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .thelist-actions .quick-log-btn{ padding:5px 10px; font-size:11px; }
  .thelist-action-btn{ font-family:Arial, sans-serif; font-size:11px; font-weight:700; color:var(--navy); background:var(--gold-light); border:1px solid var(--gold); border-radius:5px; padding:5px 8px; cursor:pointer; white-space:nowrap; }
  .thelist-action-btn:hover{ background:var(--gold); color:#fff; }

  .log-contact-form{ background:var(--cream); border:1px solid var(--gold); border-radius:8px; padding:16px 18px; font-family:Arial, sans-serif; }
  .lcf-title{ font-weight:700; color:var(--navy); font-size:13px; margin-bottom:10px; }
  .lcf-grid{ display:grid; grid-template-columns:repeat(3, minmax(160px,1fr)); gap:12px; margin-bottom:10px; }
  .lcf-grid label, .lcf-notes-label{ display:flex; flex-direction:column; gap:4px; font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .lcf-grid select, .lcf-grid input, .lcf-notes-label textarea{ font-family:Arial, sans-serif; font-size:12.5px; font-weight:400; text-transform:none; letter-spacing:normal; color:var(--ink); padding:7px 8px; border:1px solid var(--line); border-radius:5px; }
  .lcf-notes-label{ margin-bottom:12px; }
  .lcf-notes-label textarea{ resize:vertical; }
  .lcf-actions{ display:flex; gap:10px; justify-content:flex-end; }

  @media (max-width:820px){
    .lcf-grid{ grid-template-columns:1fr; }
    .owners{ grid-template-columns:1fr; }
    .owner-edit-grid, .lease-edit-grid, .edit-grid-2, .edit-grid-3{ grid-template-columns:1fr; }
    .bottom-row{ grid-template-columns:1fr; }

function escapeHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function parseDate(mmddyyyy){
  if(!mmddyyyy) return null;
  const parts = String(mmddyyyy).split('/').map(Number);
  if(parts.length !== 3 || parts.some(isNaN)) return null;
  const [m,d,y] = parts;
  const dt = new Date(y, m-1, d);
  return isNaN(dt.getTime()) ? null : dt;
}
function fmtMonthDay(dt){ return dt.toLocaleString('en-US', {month:'long', day:'numeric'}); }
function fmtFull(dt){ return dt.toLocaleString('en-US', {month:'long', day:'numeric', year:'numeric'}); }
function fmtDateSlash(dt){
  const mm = String(dt.getMonth()+1).padStart(2,'0');
  const dd = String(dt.getDate()).padStart(2,'0');
  return `${mm}/${dd}/${dt.getFullYear()}`;
}
function todayDate(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function addDaysToToday(days){
  const d = todayDate();
  d.setDate(d.getDate() + days);
  return fmtDateSlash(d);
}
// Conversions between our stored MM/DD/YYYY text format and the native
// <input type="date"> ISO format, so date fields can use a real calendar
// picker while everything already saved stays in the same format.
function mmddyyyyToIso(s){
  const d = parseDate(s);
  if(!d) return '';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function isoToMmddyyyy(s){
  if(!s) return '';
  const parts = String(s).split('-');
  if(parts.length !== 3) return '';
  const [y,m,d] = parts;
  if(!y || !m || !d) return '';
  return `${m}/${d}/${y}`;
}
function suggestLeaseEnd(startStr, months){
  const start = parseDate(startStr);
  if(!start) return null;
  const y = start.getFullYear(), m = start.getMonth();
  return new Date(y, m + months + 1, 0);
}
function sortKeyMonthDay(mmddyyyy){
  const d = parseDate(mmddyyyy);
  return d ? [d.getMonth(), d.getDate()] : [99,99];
}
function isRepeat(note){ return /REPEAT CLIENT|JASSO FAMILY/i.test(note || ''); }
function daysBetween(a,b){ return Math.round((a-b)/86400000); }
function typeArr(r){ return Array.isArray(r.client_type) ? r.client_type : []; }

// ---------------------------------------------------------------------------
function hasHouseholdContact(r){
  return !!(r.owner1_email || r.owner1_phone || r.owner2_email || r.owner2_phone);
}
function computeAutoInfoStatus(r){
  const hasName = !!(r.owner1_name && r.owner1_name.trim());
  const hasContact = hasHouseholdContact(r);
  const hasType = typeArr(r).length > 0;
  const hasRelationship = !!(r.relationship_status && r.relationship_status.trim());
  if(hasName && hasContact && hasType && hasRelationship) return 'Complete';
  if(hasName || hasContact) return 'Incomplete';
  return 'Not Reviewed';
}
function missingFieldsList(r){
  const missing = [];
  if(!(r.owner1_name && r.owner1_name.trim())) missing.push('Client name');
  if(!hasHouseholdContact(r)) missing.push('Phone or email');
  if(!(typeArr(r).length)) missing.push('Client type');
  if(!(r.relationship_status && r.relationship_status.trim())) missing.push('Relationship status');
  return missing;
}

// ---------------------------------------------------------------------------
// Follow-up status (computed live from Next Follow-Up Date, with a manual override
// for Completed / No Follow-Up Needed since those can't be derived from a date alone)
// ---------------------------------------------------------------------------
const FOLLOWUP_OVERRIDE_OPTIONS = ['Contacted','Left a Message','No Answer','Completed','No Follow-Up Needed'];
function computeFollowUpStatus(r){
  if(r.follow_up_status_override) return r.follow_up_status_override;
  const d = parseDate(r.next_follow_up_date);
  if(!d) return 'Not Scheduled';
  const days = daysBetween(d, todayDate());
  if(days < 0) return 'Overdue';
  if(days === 0) return 'Due Today';
  return 'Scheduled';
}

let upcomingWindow = 60;
let upcomingExpanded = false;

function parseMonthDay(str){
  if(!str) return null;
  const parts = String(str).trim().split('/').map(Number);
  if(parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) return null;
  const [m,d] = parts;
  if(m<1||m>12||d<1||d>31) return null;
  return {month:m, day:d};
}
function nextOccurrence(month, day, today){
  const y = today.getFullYear();
  let dt = new Date(y, month-1, day);
  if(dt < today) dt = new Date(y+1, month-1, day);
  return dt;
}
function computeUpcoming(windowDays){
  const today = todayDate();
  const items = [];
  records.forEach(r=>{
    const rental = isRentalRole(r.role);
    if(!rental){
      const md = parseMonthDay(r.sold_date);
      if(md){
        const next = nextOccurrence(md.month, md.day, today);
        const days = daysBetween(next, today);
        if(days <= windowDays) items.push({icon:'🏠', label:'Anniversary', name:r.owner1_name||'Home anniversary', sub:r.address, date:next, days, record:r});
      }
    } else {
      const end = parseDate(r.lease_end_date);
      if(end){
        const days = daysBetween(end, today);
        if(days <= windowDays) items.push({icon:'📋', label: days<0 ? 'Lease expired' : 'Lease expires', name:r.owner1_name||r.address, sub:r.address, date:end, days, record:r});
      }
    }
    [['owner1_name','owner1_birthday'],['owner2_name','owner2_birthday']].forEach(([nameKey,bdayKey])=>{
      const md = parseMonthDay(r[bdayKey]);
      if(md && r[nameKey]){
        const next = nextOccurrence(md.month, md.day, today);
        const days = daysBetween(next, today);
        if(days <= windowDays) items.push({icon:'🎂', label:'Birthday', name:r[nameKey], sub:r.address, date:next, days, record:r});
      }
    });
    const followDays = (()=>{
      const d = parseDate(r.next_follow_up_date);
      if(!d) return null;
      return daysBetween(d, today);
    })();
    if(followDays !== null && followDays <= windowDays && computeFollowUpStatus(r) !== 'Completed' && computeFollowUpStatus(r) !== 'No Follow-Up Needed'){
      items.push({icon:'📞', label: followDays<0 ? 'Follow-up overdue' : 'Follow-up due', name:r.owner1_name||r.address, sub:r.address, date:parseDate(r.next_follow_up_date), days:followDays, record:r});
    }
  });
  items.sort((a,b)=>{
    const aOver = a.days<0, bOver = b.days<0;
    if(aOver && !bOver) return -1;
    if(!aOver && bOver) return 1;
    if(aOver && bOver) return b.days - a.days;
    return a.days - b.days;
  });
  return items;
}
function upcomingWindowSelectHtml(){
  return `<label class="upcoming-window-label">Next
    <select id="upcomingWindowSel">
      <option value="30" ${upcomingWindow===30?'selected':''}>30 days</option>
      <option value="60" ${upcomingWindow===60?'selected':''}>60 days</option>
      <option value="90" ${upcomingWindow===90?'selected':''}>90 days</option>
    </select></label>`;
}
function renderUpcoming(){
  const wrap = document.getElementById('upcoming');
  if(!wrap) return;
  const items = computeUpcoming(upcomingWindow);
  if(items.length === 0){
    wrap.innerHTML = `
      <div class="upcoming-head">
        <div class="upcoming-title">Coming Up</div>
        ${upcomingWindowSelectHtml()}
      </div>
      <div class="upcoming-empty">Nothing due in the next ${upcomingWindow} days.</div>
    `;
    wireUpcomingEvents();
    return;
  }
  const collapsed = !upcomingExpanded && items.length > 6;
  const shown = collapsed ? items.slice(0,6) : items;
  wrap.innerHTML = `
    <div class="upcoming-head">
      <div class="upcoming-title">Coming Up<span class="upcoming-count">${items.length}</span></div>
      ${upcomingWindowSelectHtml()}
    </div>
    <div class="upcoming-list">
      ${shown.map(it=>{
        const urgency = it.days<0 ? 'urgent' : it.days<=7 ? 'urgent' : it.days<=30 ? 'soon' : '';
        const dayLabel = it.days<0 ? `${Math.abs(it.days)}d overdue` : it.days===0 ? 'Today' : it.days===1 ? 'Tomorrow' : `in ${it.days}d`;
        return `
        <div class="upcoming-row" data-mls="${escapeHtml(it.record.mls_number)}">
          <span class="up-icon">${it.icon}</span>
          <span class="up-label">${it.label}</span>
          <span class="up-name">${escapeHtml(it.name)}</span>
          <span class="up-sub">${escapeHtml(it.sub||'')}</span>
          <span class="up-date">${fmtMonthDay(it.date)}</span>
          <span class="up-days ${urgency}">${dayLabel}</span>
        </div>`;
      }).join('')}
    </div>
    ${items.length > 6 ? `<button class="upcoming-toggle" id="upcomingToggle">${collapsed ? `Show ${items.length-6} more` : 'Show less'}</button>` : ''}
  `;
  wireUpcomingEvents();
}
function wireUpcomingEvents(){
  const sel = document.getElementById('upcomingWindowSel');
  if(sel) sel.addEventListener('change', e=>{ upcomingWindow = Number(e.target.value); upcomingExpanded = false; renderUpcoming(); });
  const toggle = document.getElementById('upcomingToggle');
  if(toggle) toggle.addEventListener('click', ()=>{ upcomingExpanded = !upcomingExpanded; renderUpcoming(); });
  document.querySelectorAll('.upcoming-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const mls = row.dataset.mls;
      openRecordForEdit(mls);
    });
  });
}

async function loadActivityLogs(){
  const { data, error } = await sb.from(LOG_TABLE).select('*').order('created_at', {ascending:false});
  if(error) return;
  activityLogs = {};
  data.forEach(entry=>{
    if(!activityLogs[entry.mls_number]) activityLogs[entry.mls_number] = [];
    activityLogs[entry.mls_number].push(entry);
  });
}
async function addActivityLogEntry(mls, entry){
  const payload = {
    mls_number: mls,
    entry_date: entry.entry_date || fmtDateSlash(new Date()),
    entry_time: entry.entry_time || '',
    user_name: entry.user_name || 'Jeannette',
    activity_type: entry.activity_type || 'Other',
    description: entry.description || '',
    related_property: entry.related_property || '',
    previous_value: entry.previous_value || '',
    new_value: entry.new_value || '',
    follow_up_date: entry.follow_up_date || ''
  };
  const { data, error } = await sb.from(LOG_TABLE).insert(payload).select();
  if(!error && data && data[0]){
    if(!activityLogs[mls]) activityLogs[mls] = [];
    activityLogs[mls].unshift(data[0]);
  }
  return !error;
}
function activityLogHtml(mls){
  const entries = activityLogs[mls] || [];
  if(!entries.length) return '<div class="activity-empty">No activity logged yet.</div>';
  return entries.map(e=>{
    const diff = (e.previous_value || e.new_value) ? `<div class="ae-diff">${escapeHtml(e.previous_value ? `Was: ${e.previous_value} → ` : '')}${escapeHtml(e.new_value ? `Now: ${e.new_value}` : '')}</div>` : '';
    return `
      <div class="activity-entry">
        <div class="ae-head"><span>${escapeHtml(e.activity_type)}</span><span>${escapeHtml(e.entry_date)}${e.entry_time ? ' · '+escapeHtml(e.entry_time) : ''} — ${escapeHtml(e.user_name)}</span></div>
        <div class="ae-body">${escapeHtml(e.description)}${e.related_property ? ` (${escapeHtml(e.related_property)})` : ''}</div>
        ${diff}
        ${e.follow_up_date ? `<div class="ae-diff">Follow-up scheduled: ${escapeHtml(e.follow_up_date)}</div>` : ''}
      </div>
    `;
  }).join('');
}

async function loadData(){
  setSyncStatus('Syncing…');
  const { data, error } = await sb.from(TABLE).select('*');
  if(error){
    setSyncStatus('Offline — could not load', true);
    document.getElementById('list').innerHTML = '<div class="empty-state">Could not connect to load live data. Check your connection and refresh the page.</div>';

  records = data.sort((a,b)=> (parseDate(b.sold_date)||new Date(0)) - (parseDate(a.sold_date)||new Date(0)));

  setSyncStatus('Live — edits save automatically');

    const d = parseDate(r.sold_date);
    if(!d) return '';
    return `<div class="datebadge">🏠 Home anniversary: ${fmtMonthDay(d)}</div>`;
  }
  const start = parseDate(r.sold_date);
  const end = parseDate(r.lease_end_date);
  const parts = [];
  if(start) parts.push(`Lease started ${fmtFull(start)}`);
  if(end){
    const daysLeft = daysBetween(end, todayDate());
    const warn = daysLeft <= 60;
    parts.push(`<span class="${warn?'lease-warn':''}">Lease expires ${fmtFull(end)}${warn && daysLeft>=0 ? ` (${daysLeft}d)` : ''}</span>`);
  } else {
    const estimate = suggestLeaseEnd(r.sold_date, 12);
    if(estimate){
      parts.push(`<span class="lease-missing">Est. lease expires ${fmtFull(estimate)} (12-mo. default — confirm in Edit)</span>`);
    } else {
      parts.push('<span class="lease-missing">Add lease end date</span>');
    }
  }
  return `<div class="datebadge${end && daysBetween(end, todayDate()) <= 60 ? ' lease-warn' : ''}">📋 ${parts.join(' · ')}</div>`;
}

function followUpRowHtml(r){
  const status = computeFollowUpStatus(r);
  const parts = [];
  if(r.last_contact_date) parts.push(`Last contact: ${escapeHtml(r.last_contact_date)}`);
  if(r.next_follow_up_date) parts.push(`Next follow-up: ${escapeHtml(r.next_follow_up_date)}${r.assigned_agent ? ' ('+escapeHtml(r.assigned_agent)+')' : ''}`);
  if(!parts.length && status==='Not Scheduled') return '';
  return `<div class="followup-row"><span class="followup-pill badge ${toneOf(status)}">${escapeHtml(status)}</span>${parts.join(' &middot; ')}</div>`;
}

function badgesHtml(r){
  const types = typeArr(r);
  return `
    <span class="badge ${toneOf(r.client_info_status)}">${escapeHtml(r.client_info_status)}</span>
    <span class="badge ${toneOf(r.relationship_status)}">${escapeHtml(r.relationship_status||'—')}</span>

// ---------------------------------------------------------------------------
// Main list rendering (Clients view) vs The List (table view)
// ---------------------------------------------------------------------------
function matchesSearch(r, term){
  if(!term) return true;
  const hay = `${r.address} ${r.city} ${r.mls_number} ${r.owner1_name} ${r.owner2_name} ${r.owner1_email} ${r.owner2_email} ${r.client_note}`.toLowerCase();
  return hay.includes(term);
}
function filteredRecords(){
  const term = searchTerm.trim().toLowerCase();
  let filtered = records.filter(r=>{
    if(activeQuickView){
      const qv = QUICK_VIEWS.find(q=>q.key===activeQuickView);
      if(qv && !qv.test(r)) return false;
    } else {
      if(filterInfo !== 'all' && r.client_info_status !== filterInfo) return false;
      if(filterRelationship !== 'all' && r.relationship_status !== filterRelationship) return false;
      if(filterType !== 'all' && !typeArr(r).includes(filterType)) return false;
      if(filterPropStatus !== 'all' && (r.property_status||'Unknown') !== filterPropStatus) return false;
    }
    if(!matchesSearch(r, term)) return false;
    return true;
  });

  if(sortMode === 'anniv'){
    filtered = filtered.slice().sort((a,b)=>{
      const aKey = isRentalRole(a.role) ? sortKeyMonthDay(a.lease_end_date || a.sold_date) : sortKeyMonthDay(a.sold_date);
      const bKey = isRentalRole(b.role) ? sortKeyMonthDay(b.lease_end_date || b.sold_date) : sortKeyMonthDay(b.sold_date);
      return aKey[0]-bKey[0] || aKey[1]-bKey[1];
    });
  } else if(sortMode === 'followup'){
    filtered = filtered.slice().sort((a,b)=>{
      const da = parseDate(a.next_follow_up_date), db = parseDate(b.next_follow_up_date);
      if(!da && !db) return 0;
      if(!da) return 1;
      if(!db) return -1;
      return da - db;
    });
  } else {
    filtered = filtered.slice().sort((a,b)=> (parseDate(b.sold_date)||new Date(0)) - (parseDate(a.sold_date)||new Date(0)));
  }
  return filtered;
}

    const logExpanded = expandedLogMls === r.mls_number;
    return `

        ${logExpanded ? `<div class="activity-log">${activityLogHtml(r.mls_number)}</div>` : ''}

}

function logContactFormHtml(r, mode){
  const isResult = mode === 'result';
  return `
    <tr class="log-contact-row">
      <td colspan="20">
        <div class="log-contact-form">
          <div class="lcf-title">${isResult ? 'Log Result' : 'Log Call'} — ${escapeHtml(r.owner1_name || 'Name unknown')}</div>

            <label>Contact Method
              <select class="lcf-method">${CONTACT_ACTIVITY_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('')}</select>
            </label>
            ${isResult ? `
            <label>Result
              <select class="lcf-result">
                <option value="">— Select a result —</option>
                ${REFERRAL_RESULTS.map(res=>`<option value="${res.key}">${res.label}</option>`).join('')}
              </select>
            </label>` : ''}
            <label>Next Follow-Up
              <input type="date" class="lcf-nextfollowup" value="${mmddyyyyToIso(r.next_follow_up_date)}">
            </label>
          </div>
          <label class="lcf-notes-label">Notes
            <textarea class="lcf-notes" rows="2" placeholder="What did you talk about?"></textarea>
          </label>
          <div class="lcf-actions">
            <button class="thelist-action-btn lcf-new-lead" type="button">+ New Lead From This Call</button>
            <span style="flex:1;"></span>
            <button class="btn-pill ui lcf-cancel" type="button">Cancel</button>
            <button class="btn-pill primary ui lcf-save" type="button">Save</button>
          </div>
        </div>
      </td>
    </tr>
  `;
}
function wireLogContactForm(wrap, rerender){
  const formRow = wrap.querySelector('.log-contact-row');
  if(!formRow) return;
  const mls = logContactMls;
  const resultSel = formRow.querySelector('.lcf-result');
  const nextInput = formRow.querySelector('.lcf-nextfollowup');
  if(resultSel){
    resultSel.addEventListener('change', ()=>{
      const res = REFERRAL_RESULTS.find(x=>x.key===resultSel.value);
      if(res && res.days != null) nextInput.value = mmddyyyyToIso(addDaysToToday(res.days));
    });
  }
  formRow.querySelector('.lcf-cancel').addEventListener('click', ()=>{
    logContactMls = null; logContactMode = null;
    rerender();
  });

  async function saveLogContact(){
    const rec = records.find(r=>r.mls_number===mls);
    if(!rec) return null;
    const method = formRow.querySelector('.lcf-method').value;
    const notes = formRow.querySelector('.lcf-notes').value.trim();
    const nextFollowUp = isoToMmddyyyy(nextInput.value);
    const resultKey = resultSel ? resultSel.value : '';
    const resultObj = REFERRAL_RESULTS.find(x=>x.key===resultKey);
    const todayStr = fmtDateSlash(new Date());
    const prevNext = rec.next_follow_up_date;

    const updates = { last_contact_date: todayStr, next_follow_up_date: nextFollowUp, updated_at: new Date().toISOString() };
    const { error } = await sb.from(TABLE).update(updates).eq('mls_number', mls);
    if(error){ showToast('Could not save — please try again', true); return null; }
    Object.assign(rec, updates);

    const desc = `${notes || ('Logged ' + method.toLowerCase() + '.')}${resultObj ? ' — Result: ' + resultObj.label : ''}`;
    await addActivityLogEntry(mls, {
      activity_type: method,
      description: desc,
      related_property: rec.address,
      previous_value: prevNext ? `Next follow-up: ${prevNext}` : '',
      new_value: nextFollowUp ? `Next follow-up: ${nextFollowUp}` : '',
      follow_up_date: nextFollowUp
    });

    showToast('Saved');

    if(resultObj && resultObj.key === 'became-client' && rec.relationship_status !== 'Active Client'){
      const prevRel = rec.relationship_status;
      showConfirmModal(
        'Update Relationship Status?',
        `Mark ${rec.owner1_name || 'this contact'} as an Active Client now that they've moved forward?`,
        'Yes, Make Active',
        async (confirmed)=>{
          if(confirmed){
            const { error: err2 } = await sb.from(TABLE).update({relationship_status:'Active Client', updated_at: new Date().toISOString()}).eq('mls_number', mls);
            if(!err2){
              rec.relationship_status = 'Active Client';
              await addActivityLogEntry(mls, {activity_type:'Status Changed', description:`Relationship Status changed from ${prevRel} to Active Client.`, related_property: rec.address, previous_value: prevRel, new_value:'Active Client'});
              showToast('Updated to Active Client');
            }
          }
          rerender();
        }
      );
    }
    return rec;
  }

  formRow.querySelector('.lcf-save').addEventListener('click', async ()=>{
    const rec = await saveLogContact();
    if(!rec) return;
    logContactMls = null; logContactMode = null;
    rerender();
  });

  formRow.querySelector('.lcf-new-lead').addEventListener('click', async ()=>{
    const rec = records.find(r=>r.mls_number===mls);
    if(!rec) return;
    await saveLogContact();
    logContactMls = null; logContactMode = null;
    openAddLead({ relationship_status:'Warm Lead', referred_by: rec.owner1_name || '' });
  });
}

function clientTypeCheckboxesHtml(selected){
  return CLIENT_TYPES.map(t=>`
    <label class="checkbox-pill"><input type="checkbox" class="f-client-type" value="${t}" ${selected.includes(t)?'checked':''}>${t}</label>
  `).join('');

function selectHtml(cls, options, current, placeholder){
  return `<select class="${cls}">
    ${placeholder ? `<option value="" ${!current?'selected':''}>${placeholder}</option>` : ''}
    ${options.map(o=>`<option value="${o}" ${current===o?'selected':''}>${o}</option>`).join('')}
  </select>`;
}

        client_status: 'NO_RESEARCH',
        updated_at: new Date().toISOString()
      };
      newRecord.client_name = newRecord.owner1_name + (newRecord.owner2_name ? ` & ${newRecord.owner2_name}` : '');
      newRecord.client_email = [newRecord.owner1_email, newRecord.owner2_email].filter(Boolean).join('; ');

      saveBtn.disabled = true; saveBtn.textContent = 'Adding…';
      const { error } = await sb.from(TABLE).insert(newRecord);
      if(error){ showToast('Could not add — please try again', true); saveBtn.disabled=false; saveBtn.textContent='Add to Dashboard'; return; }
      records.unshift(newRecord);
      await addActivityLogEntry(mls, {activity_type:'Record Created', description: newRecord.referred_by ? `New referral lead created — referred by ${newRecord.referred_by}.` : 'New client/property record created.', related_property: address});
      addingNew = false;
      newLeadPrefill = null;
      updateStats();
      renderUpcoming();
      renderMainView();
      showToast('Added — now visible to everyone viewing this page');
    });
  }
}

function wireEditCardEvents(){
  const list = document.getElementById('list');
  const cancelBtn = list.querySelector('[data-cancel]');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editingMls = null; render(); });

  const overrideBox = list.querySelector('.f-info-override');
  if(overrideBox){
    overrideBox.addEventListener('change', ()=>{
      const sel = list.querySelector('.f-info-status');
      const hint = list.querySelector('#autoStatusHint');
      sel.disabled = !overrideBox.checked;
      if(!overrideBox.checked){
        const r = records.find(x=>x.mls_number===editingMls);
        const draft = { ...r,
          owner1_name: list.querySelector('.f-o1-name').value.trim(),
          owner1_email: list.querySelector('.f-o1-email').value.trim(),
          owner1_phone: list.querySelector('.f-o1-phone').value.trim(),
          owner2_email: list.querySelector('.f-o2-email').value.trim(),
          owner2_phone: list.querySelector('.f-o2-phone').value.trim(),
          relationship_status: list.querySelector('.f-relationship').value,
          client_type: Array.from(list.querySelectorAll('.f-client-type:checked')).map(cb=>cb.value)
        };
        const auto = computeAutoInfoStatus(draft);
        sel.value = auto;
        hint.textContent = `Auto-computed from the fields above: ${auto}.`;
      } else {
        hint.textContent = 'Manually overridden.';
      }
    });
  }

  const logAddBtn = list.querySelector('[data-log-add]');
  if(logAddBtn){
    logAddBtn.addEventListener('click', async ()=>{
      const mls = logAddBtn.dataset.logAdd;
      const type = list.querySelector('.f-log-type').value;
      const desc = list.querySelector('.f-log-desc').value.trim();
      const followup = isoToMmddyyyy(list.querySelector('.f-log-followup').value);
      if(!desc){ showToast('Add a short description before logging', true); return; }
      const r = records.find(x=>x.mls_number===mls);
      const updates = {};
      if(CONTACT_ACTIVITY_TYPES.includes(type)) updates.last_contact_date = fmtDateSlash(new Date());
      if(followup) updates.next_follow_up_date = followup;
      if(Object.keys(updates).length){
        updates.updated_at = new Date().toISOString();
        await sb.from(TABLE).update(updates).eq('mls_number', mls);
        if(r) Object.assign(r, updates);
      }
      await addActivityLogEntry(mls, {activity_type:type, description:desc, related_property: r?r.address:'', follow_up_date: followup});
      showToast('Activity logged');
      render();
    });
  }

  const saveBtn = list.querySelector('[data-save]');
  if(saveBtn){
    saveBtn.addEventListener('click', async ()=>{
      const card = list.querySelector('.card.editing');
      const mls = saveBtn.dataset.save;
      const r = records.find(x=>x.mls_number===mls);
      const prevInfoStatus = r.client_info_status, prevRelationship = r.relationship_status, prevPropStatus = r.property_status;

      const clientTypes = Array.from(card.querySelectorAll('.f-client-type:checked')).map(cb=>cb.value);
      const overridden = card.querySelector('.f-info-override').checked;
      const updates = {
        owner1_name: card.querySelector('.f-o1-name').value.trim(),
        owner1_email: card.querySelector('.f-o1-email').value.trim(),
        owner1_phone: card.querySelector('.f-o1-phone').value.trim(),
        owner1_birthday: card.querySelector('.f-o1-bday').value.trim(),
        owner2_name: card.querySelector('.f-o2-name').value.trim(),
        owner2_email: card.querySelector('.f-o2-email').value.trim(),
        owner2_phone: card.querySelector('.f-o2-phone').value.trim(),
        owner2_birthday: card.querySelector('.f-o2-bday').value.trim(),
        relationship_status: card.querySelector('.f-relationship').value,
        client_type: clientTypes,
        assigned_agent: card.querySelector('.f-assigned-agent').value,
        referred_by: card.querySelector('.f-referred-by').value.trim(),
        property_status: card.querySelector('.f-prop-status').value,
        last_contact_date: isoToMmddyyyy(card.querySelector('.f-last-contact').value),
        next_follow_up_date: isoToMmddyyyy(card.querySelector('.f-next-followup').value),
        follow_up_reason: card.querySelector('.f-followup-reason').value.trim(),
        follow_up_status_override: card.querySelector('.f-followup-override').value,
        annual_review_status: card.querySelector('.f-review-status').value,
        annual_review_last_date: isoToMmddyyyy(card.querySelector('.f-review-last').value),
        annual_review_next_date: isoToMmddyyyy(card.querySelector('.f-review-next').value),
        comparable_sales_link: card.querySelector('.f-comps-link').value.trim(),
        printable_report_link: card.querySelector('.f-report-link').value.trim(),
        client_note: card.querySelector('.f-note').value.trim(),
        client_info_status_overridden: overridden,
        updated_at: new Date().toISOString()
      };
      const estVal = card.querySelector('.f-est-value').value.trim();
      const origVal = card.querySelector('.f-orig-price').value.trim();
      updates.estimated_current_value = estVal ? Number(estVal.replace(/[^0-9.-]/g,'')) : null;
      updates.original_purchase_price = origVal ? Number(origVal.replace(/[^0-9.-]/g,'')) : null;

      updates.client_info_status = overridden
        ? card.querySelector('.f-info-status').value
        : computeAutoInfoStatus({...updates});

      const leaseStartEl = card.querySelector('.f-lease-start');
      const leaseEndEl = card.querySelector('.f-lease-end');
      if(leaseStartEl) updates.sold_date = leaseStartEl.value.trim();
      if(leaseEndEl) updates.lease_end_date = leaseEndEl.value.trim();
      updates.client_name = updates.owner1_name + (updates.owner2_name ? ` & ${updates.owner2_name}` : '');
      updates.client_email = [updates.owner1_email, updates.owner2_email].filter(Boolean).join('; ');

      const finishSave = async ()=>{
        saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
        const { error } = await sb.from(TABLE).update(updates).eq('mls_number', mls);
        if(error){ showToast('Could not save — please try again', true); saveBtn.disabled=false; saveBtn.textContent='Save Changes'; return; }
        Object.assign(r, updates);

        if(updates.client_info_status !== prevInfoStatus){
          await addActivityLogEntry(mls, {activity_type:'Status Changed', description: overridden ? 'Client Information Status manually overridden.' : 'Client Information Status changed.', related_property:r.address, previous_value: prevInfoStatus, new_value: updates.client_info_status});
        }
        if(updates.relationship_status !== prevRelationship){
          await addActivityLogEntry(mls, {activity_type:'Status Changed', description:'Relationship Status changed.', related_property:r.address, previous_value: prevRelationship, new_value: updates.relationship_status});
        }
        if(updates.property_status !== prevPropStatus){
          await addActivityLogEntry(mls, {activity_type:'Property Ownership Updated', description:'Property Status changed.', related_property:r.address, previous_value: prevPropStatus, new_value: updates.property_status});
        }

        const confirmEl = document.getElementById(`saveConfirm-${mls}`);
        if(confirmEl) confirmEl.classList.add('show');
        updateStats();
        renderUpcoming();
        render();
        showToast('Saved — everyone viewing this page now sees the update');
      };

      // Active Client Logic: ask before flipping Active Client -> Past Client on a closing transaction
      const closingStatuses = ['Purchased','Sold','Leased'];
      if(prevRelationship === 'Active Client' && closingStatuses.includes(updates.property_status) && updates.property_status !== prevPropStatus){
        showConfirmModal(
          'Move to Past Client?',
          `This property status is changing to "${updates.property_status}" — the transaction appears to have closed. Change Relationship Status from Active Client to Past Client?`,
          'Yes, Move to Past Client',
          async (confirmed)=>{
            if(confirmed) updates.relationship_status = 'Past Client';
            await finishSave();
          }
        );
      } else {
        await finishSave();
      }
    });
  }
}

    if(card) card.scrollIntoView({behavior:'smooth', block:'center'});
  });
});

// ---------------------------------------------------------------------------
// CSV export / import
// ---------------------------------------------------------------------------
const CSV_COLUMNS = ['mls_number','address','city','category_mls','transaction_type','represented','role','sold_year','list_price','sold_price','list_date','sold_date','dom',
  'client_info_status','relationship_status','assigned_agent','referred_by','property_status','client_note',
  'owner1_name','owner1_email','owner1_phone','owner1_birthday','owner2_name','owner2_email','owner2_phone','owner2_birthday','lease_end_date',
  'last_contact_date','next_follow_up_date','follow_up_reason',
  'annual_review_status','annual_review_last_date','annual_review_next_date','estimated_current_value','original_purchase_price'];

function csvEscape(val){
  const s = val==null ? '' : String(val);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function exportCsv(){
  const rows = [CSV_COLUMNS.join(',')];
  records.forEach(r=>{
    rows.push(CSV_COLUMNS.map(col=> csvEscape(col==='client_type' ? typeArr(r).join('|') : r[col])).join(','));
  });
  const csv = rows.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `properties-clients-export-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`Exported ${records.length} records to CSV`);
}

function parseCsvText(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length===1 && r[0] !== ''));
}

async function importCsvFile(file){
  const text = await file.text();
  const rows = parseCsvText(text);
  if(rows.length < 2){ showToast('CSV appears to be empty', true); return; }
  const headers = rows[0].map(h=>h.trim());
  const dataRows = rows.slice(1);
  const numericCols = new Set(['sold_year','list_price','sold_price','dom','estimated_current_value','original_purchase_price']);
  const payload = dataRows.map(cols=>{
    const obj = {};
    headers.forEach((h,i)=>{
      if(!CSV_COLUMNS.includes(h)) return;
      let v = cols[i] !== undefined ? cols[i] : '';
      obj[h] = numericCols.has(h) ? (v === '' ? null : Number(v)) : v;
    });
    return obj;
  }).filter(o => o.mls_number);

  if(!payload.length){ showToast('No valid rows found (need an mls_number column)', true); return; }

  showToast(`Importing ${payload.length} rows…`);
  const BATCH = 50;
  let imported = 0, failed = 0;
  for(let i=0; i<payload.length; i+=BATCH){
    const batch = payload.slice(i, i+BATCH);
    const { error } = await sb.from(TABLE).upsert(batch, {onConflict:'mls_number'});
    if(error) failed += batch.length; else imported += batch.length;
  }
  showToast(failed ? `Imported ${imported} rows, ${failed} failed` : `Imported ${imported} rows successfully`, !!failed);
  await loadData();
}

document.getElementById('exportCsvBtn').addEventListener('click', exportCsv);
document.getElementById('importCsvBtn').addEventListener('click', ()=> document.getElementById('importFileInput').click());
document.getElementById('importFileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(file) importCsvFile(file);
  e.target.value = '';
});

loadData();
