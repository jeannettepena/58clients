<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Properties &amp; Clients — The 58 Group</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap');

  :root{
    --navy:#1B2B3A;
    --navy-2:#243647;
    --navy-3:#2E4358;
    --champ:#C9A87C;
    --champ-2:#D4B98A;
    --champ-wash:#F5EBD8;
    --teal:#5E887E;
    --teal-wash:#EAF2F0;
    --cream:#F4F1EC;
    --paper:#FDFAF6;
    --border:#DDD8D0;
    --ink:#1B2B3A;
    --ink2:#4A5568;
    --ink3:#7A7770;
    --ink4:#A0998F;
    --green-bg:#E7F3EA; --green-tx:#1B6E3A;
    --amber-bg:#FBF1DA; --amber-tx:#8A6413;
    --grey-bg:#EEEFF1; --grey-tx:#555555;
    --red-bg:#F7ECEC; --red-tx:#9C3B3B;
    --r:12px;
    --shadow:0 1px 3px rgba(27,43,58,.06),0 8px 24px rgba(27,43,58,.08);
    --shadow-sm:0 1px 2px rgba(27,43,58,.04),0 4px 12px rgba(27,43,58,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Jost',sans-serif;font-weight:300;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:.01em;}
  .ui{font-family:'Jost',sans-serif;}
  ::selection{background:var(--champ-wash);}

  /* NAV */
  .jp58-topnav{background:var(--navy);padding:10px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
  .jp58-topnav-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:300;color:var(--champ);letter-spacing:.06em;}
  .jp58-topnav-links{display:flex;gap:8px;}
  .jp58-topnav-link{font-family:'Jost',sans-serif;font-size:11px;color:rgba(244,241,236,.45);text-decoration:none;border:1px solid rgba(255,255,255,.1);padding:4px 14px;border-radius:20px;letter-spacing:.06em;transition:all .2s;}
  .jp58-topnav-link:hover{color:var(--champ);border-color:rgba(201,168,124,.4);}

  /* HEADER */
  header{background:var(--navy);color:#fff;padding:28px 6vw 24px;text-align:center;border-bottom:1px solid var(--navy-2);}
  header .logo-mark{display:none;}
  header h1{font-family:'Cormorant Garamond',serif;font-weight:300;margin:0 0 4px;font-size:36px;letter-spacing:.02em;color:#fff;}
  header h1 em{font-style:italic;color:var(--champ);}
  header .subline{font-family:'Jost',sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:10px;color:rgba(244,241,236,.4);margin-top:4px;font-weight:400;}
  #syncStatus{font-family:'Jost',sans-serif;font-size:11px;color:rgba(244,241,236,.4);position:absolute;top:auto;bottom:16px;right:6vw;}
  #syncStatus.err{color:#F3B9B9;}

  /* VIEW TABS */
  .view-tabs-wrap{background:var(--paper);border-bottom:1px solid var(--border);position:sticky;top:46px;z-index:100;}
  .view-tabs{display:flex;gap:4px;padding:0 6vw;max-width:1180px;margin:0 auto;}
  .view-tab{font-family:'Jost',sans-serif;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:14px 16px 12px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--ink3);cursor:pointer;transition:all .2s;}
  .view-tab:hover{color:var(--ink);}
  .view-tab.active{color:var(--champ);border-bottom-color:var(--champ);font-weight:500;}

  /* UPCOMING */
  .upcoming-panel{margin:16px 6vw 0;background:var(--paper);border:1px solid var(--border);border-radius:var(--r);padding:20px 24px;box-shadow:var(--shadow-sm);}
  .upcoming-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
  .upcoming-title{font-family:'Jost',sans-serif;font-size:11px;font-weight:500;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;}
  .upcoming-title .upcoming-count{font-family:'Jost',sans-serif;font-size:10px;font-weight:500;background:var(--champ-wash);color:var(--navy);padding:2px 8px;border-radius:20px;margin-left:8px;}
  .upcoming-window-label{font-family:'Jost',sans-serif;font-size:12px;color:var(--ink3);}
  .upcoming-window-label select{font-family:'Jost',sans-serif;font-size:12px;border:1px solid var(--border);border-radius:6px;padding:4px 6px;color:var(--ink);background:#fff;margin-left:4px;}
  .btn-pill{font-family:'Jost',sans-serif;font-size:12px;font-weight:500;letter-spacing:.06em;padding:8px 18px;border-radius:30px;border:1px solid var(--border);background:var(--paper);color:var(--ink3);cursor:pointer;transition:all .2s;}
  .btn-pill:hover{border-color:var(--champ);color:var(--navy);}
  .btn-pill.primary{background:var(--navy);color:var(--champ);border-color:var(--navy);}
  .btn-pill.primary:hover{background:var(--champ);color:var(--navy);border-color:var(--champ);}
  .upcoming-empty{font-family:'Jost',sans-serif;font-size:12px;color:var(--ink4);font-style:italic;padding:4px 0;}
  .upcoming-list{display:flex;flex-direction:column;gap:8px;}
  .upcoming-row{display:flex;align-items:center;gap:12px;font-family:'Jost',sans-serif;font-size:12px;color:var(--ink);background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:10px 14px;transition:border-color .2s;}
  .upcoming-row:hover{border-color:var(--champ);}
  .upcoming-row .up-label{flex:0 0 auto;font-weight:500;color:var(--navy);white-space:nowrap;font-size:11px;letter-spacing:.04em;}
  .upcoming-row .up-name{flex:1;font-weight:400;}
  .upcoming-row .up-date{font-size:11px;color:var(--ink3);white-space:nowrap;}
  .up-icon{display:flex;align-items:center;color:var(--champ);flex-shrink:0;}
  .lrow .when{font-size:11px;font-weight:500;background:var(--champ-wash);color:var(--navy);padding:2px 8px;border-radius:20px;white-space:nowrap;}
  .lrow .when.soon{background:var(--amber-bg);color:var(--amber-tx);}
  .upcoming-toggle{font-family:'Jost',sans-serif;font-size:11px;font-weight:500;color:var(--champ);background:none;border:none;cursor:pointer;padding:6px 0 0;letter-spacing:.04em;}

  /* STATS */
  .stats-row{display:flex;gap:10px;padding:16px 6vw 0;margin:0 auto;max-width:1180px;}
  .stat-card{font-family:'Jost',sans-serif;background:var(--navy);border:1px solid var(--navy-2);border-radius:10px;padding:12px 0;flex:1 1 0;min-width:0;text-align:center;}
  .stat-card .num{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;color:var(--champ);line-height:1;font-style:italic;}
  .stat-card .lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(244,241,236,.45);margin-top:3px;font-weight:400;}

  /* QUICK VIEWS */
  .quickviews{font-family:'Jost',sans-serif;margin:14px 6vw 0;display:flex;gap:6px;flex-wrap:wrap;}
  .qv-btn{font-size:11px;font-weight:500;letter-spacing:.04em;padding:6px 14px;border-radius:30px;border:1px solid var(--border);background:var(--paper);color:var(--ink3);cursor:pointer;white-space:nowrap;transition:all .2s;}
  .qv-btn:hover{border-color:var(--champ);color:var(--navy);}
  .qv-btn.active{background:var(--navy);border-color:var(--navy);color:var(--champ);}

  /* CONTROLS */
  .controls{font-family:'Jost',sans-serif;margin:12px 6vw 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .controls input[type=search],.controls input[type=text]{font-family:'Jost',sans-serif;font-size:13px;font-weight:300;padding:8px 14px;border:1px solid var(--border);border-radius:30px;background:var(--paper);color:var(--ink);outline:none;transition:border-color .2s;min-width:220px;}
  .controls input[type=search]:focus,.controls input[type=text]:focus{border-color:var(--champ);}
  .controls select{font-family:'Jost',sans-serif;font-size:12px;padding:8px 12px;border:1px solid var(--border);border-radius:30px;background:var(--paper);color:var(--ink);outline:none;cursor:pointer;}
  #btn-add svg{margin-right:6px;vertical-align:middle;}
  #btn-add{font-family:'Jost',sans-serif;font-size:12px;font-weight:500;letter-spacing:.06em;padding:8px 20px;border-radius:30px;border:none;background:var(--navy);color:var(--champ);cursor:pointer;transition:all .2s;white-space:nowrap;}
  #btn-add:hover{background:var(--champ);color:var(--navy);}
  #btn-export,#btn-import{font-family:'Jost',sans-serif;font-size:11px;font-weight:500;padding:7px 14px;border-radius:30px;border:1px solid var(--border);background:var(--paper);color:var(--ink3);cursor:pointer;transition:all .2s;}
  #btn-export:hover,#btn-import:hover{border-color:var(--champ);color:var(--navy);}

  /* CHIPS & BADGES */
  .chip{font-size:10px;letter-spacing:.06em;padding:3px 10px;border-radius:20px;white-space:nowrap;font-weight:400;font-family:'Jost',sans-serif;}
  .pill-team{background:var(--champ-wash);color:var(--navy);font-size:10px;letter-spacing:.06em;padding:3px 10px;border-radius:20px;white-space:nowrap;font-family:'Jost',sans-serif;}

  /* CLIENT CARDS */
  .client-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:16px 0 40px;}
  .client-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow-sm);cursor:pointer;transition:all .25s;position:relative;overflow:hidden;}
  .client-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--champ);opacity:0;transition:opacity .2s;}
  .client-card:hover{border-color:var(--champ);box-shadow:var(--shadow);transform:translateY(-2px);}
  .client-card:hover::before{opacity:1;}
  .cc-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
  .cc-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;color:var(--navy);line-height:1.2;}
  .cc-type{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink4);margin-top:3px;font-family:'Jost',sans-serif;}
  .cc-status{font-size:10px;font-weight:500;padding:3px 10px;border-radius:20px;white-space:nowrap;font-family:'Jost',sans-serif;letter-spacing:.04em;}
  .cc-address{font-family:'Jost',sans-serif;font-size:13px;color:var(--ink2);margin-bottom:8px;}
  .cc-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .cc-tag{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--cream);border:1px solid var(--border);color:var(--ink3);font-family:'Jost',sans-serif;}
  .cc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);}
  .cc-next{font-size:11px;color:var(--ink3);font-family:'Jost',sans-serif;}
  .cc-next b{color:var(--champ);font-weight:500;}
  .cc-av{width:26px;height:26px;border-radius:50%;background:var(--navy);color:var(--champ);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;font-family:'Jost',sans-serif;}

  /* TABLE (The List / Referrals) */
  .thelist-table{margin:0 0 60px;border-collapse:collapse;width:100%;font-family:'Jost',sans-serif;font-size:12.5px;background:var(--paper);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm);}
  .thelist-table th{background:var(--navy);color:var(--champ);text-align:left;padding:10px 14px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:500;}
  .thelist-table td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top;}
  .thelist-table tr:hover td{background:var(--cream);}
  .thelist-table select{font-family:'Jost',sans-serif;font-size:11.5px;padding:4px 6px;border:1px solid var(--border);border-radius:6px;background:var(--paper);}

  /* SHEET / MODAL */
  .overlay{position:fixed;inset:0;background:rgba(27,43,58,.5);backdrop-filter:blur(4px);z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;}
  .overlay.on{opacity:1;pointer-events:all;}
  .sheet{position:fixed;right:0;top:0;bottom:0;width:min(580px,100vw);background:var(--paper);box-shadow:-20px 0 60px rgba(27,43,58,.2);z-index:301;overflow-y:auto;transform:translateX(40px);transition:transform .35s cubic-bezier(.2,.7,.25,1);}
  .overlay.on .sheet{transform:translateX(0);}
  .sheet-head{background:var(--navy);padding:24px 24px 20px;color:#fff;}
  .sheet-badge{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(201,168,124,.7);font-family:'Jost',sans-serif;margin-bottom:6px;font-weight:500;}
  .sheet-name{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:#fff;margin:0;}
  .sheet-sub{font-family:'Jost',sans-serif;font-size:12px;color:rgba(244,241,236,.5);margin-top:4px;}
  .sheet-body{padding:20px 24px;}
  .sheet-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:18px;}
  .tab{font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:10px 16px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--ink3);cursor:pointer;transition:all .2s;}
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--champ);border-bottom-color:var(--champ);}
  .f-group{margin-bottom:14px;}
  .f-group label{display:block;font-family:'Jost',sans-serif;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px;}
  .f-group input,.f-group select,.f-group textarea{width:100%;font-family:'Jost',sans-serif;font-size:13px;font-weight:300;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);outline:none;transition:border-color .2s;}
  .f-group input:focus,.f-group select:focus,.f-group textarea:focus{border-color:var(--champ);}
  .btn-save{font-family:'Jost',sans-serif;font-size:12px;font-weight:500;letter-spacing:.06em;padding:9px 24px;border-radius:30px;border:none;background:var(--navy);color:var(--champ);cursor:pointer;transition:all .2s;}
  .btn-save:hover{background:var(--champ);color:var(--navy);}
  .btn-del{font-family:'Jost',sans-serif;font-size:12px;padding:9px 18px;border-radius:30px;border:1px solid var(--border);background:transparent;color:var(--ink3);cursor:pointer;transition:all .2s;}
  .btn-del:hover{border-color:#C24A3B;color:#C24A3B;}


  /* EDIT DRAWER */
  .edit-drawer{position:fixed;right:0;top:0;bottom:0;width:min(600px,100vw);background:var(--paper);z-index:400;overflow-y:auto;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.7,.25,1);box-shadow:-20px 0 60px rgba(27,43,58,.2);}
  .edit-drawer.open{transform:translateX(0);}
  .overlay{position:fixed;inset:0;background:rgba(27,43,58,.45);backdrop-filter:blur(3px);z-index:399;opacity:0;pointer-events:none;transition:opacity .3s;}
  .overlay.open{opacity:1;pointer-events:all;}
  .drawer-head{background:var(--navy);padding:24px 24px 20px;display:flex;align-items:flex-start;justify-content:space-between;}
  .drawer-body{padding:24px;}
  .drawer-section{margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--border);}
  .drawer-section:last-child{border-bottom:none;}
  .drawer-section-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:500;margin-bottom:14px;font-family:'Jost',sans-serif;}
  .drawer-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .drawer-field{display:flex;flex-direction:column;gap:4px;}
  .drawer-field label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:500;font-family:'Jost',sans-serif;}
  .drawer-field input,.drawer-field select,.drawer-field textarea{font-family:'Jost',sans-serif;font-size:13px;font-weight:300;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);outline:none;transition:border-color .2s;width:100%;}
  .drawer-field input:focus,.drawer-field select:focus,.drawer-field textarea:focus{border-color:var(--champ);}
  .drawer-actions{display:flex;gap:10px;padding:20px 24px;border-top:1px solid var(--border);background:var(--paper);position:sticky;bottom:0;}


  /* LAYOUT */
  .page-wrap{max-width:1180px;margin:0 auto;padding:0 6vw;}
  .page-wrap .client-grid{padding-left:0;padding-right:0;}
  .page-wrap .upcoming-panel{margin-left:0;margin-right:0;}
  .page-wrap .filter-row{margin-left:0;margin-right:0;}
  .page-wrap .controls{margin-left:0;margin-right:0;}
  .page-wrap .quickviews{margin-left:0;margin-right:0;}
  .page-wrap .stats-row{padding-left:0;padding-right:0;}
  .page-wrap .thelist-table{margin-left:0;margin-right:0;width:100%;}

  /* GROUPED CLIENT CARDS */
  .client-group{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden;position:relative;transition:all .25s;}
  .client-group::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--champ);opacity:0;transition:opacity .2s;}
  .client-group:hover::before{opacity:1;}
  .client-group-head{padding:16px 20px;cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;transition:background .2s;}
  .client-group-head:hover{background:var(--cream);}
  .cg-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;color:var(--navy);line-height:1.2;}
  .cg-meta{font-size:11px;color:var(--ink3);margin-top:3px;font-family:'Jost',sans-serif;}
  .cg-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
  .cg-count{font-size:10px;font-weight:500;letter-spacing:.08em;background:var(--navy);color:var(--champ);padding:3px 10px;border-radius:20px;font-family:'Jost',sans-serif;}
  .cg-chevron{transition:transform .25s;color:var(--ink4);}
  .client-group.expanded .cg-chevron{transform:rotate(180deg);}
  .cg-properties{display:none;border-top:1px solid var(--border);}
  .client-group.expanded .cg-properties{display:block;}
  .cg-prop-row{display:flex;align-items:center;gap:12px;padding:11px 20px;border-bottom:1px solid var(--border);transition:background .15s;}
  .cg-prop-row:last-child{border-bottom:none;}
  .cg-prop-row:hover{background:var(--cream);}
  .cg-prop-dot{width:6px;height:6px;border-radius:50%;background:var(--champ);flex-shrink:0;}
  .cg-prop-dot.sold{background:var(--teal);}
  .cg-prop-dot.lease{background:var(--champ-2);}
  .cg-prop-dot.active{background:#5E887E;}
  .cg-prop-addr{font-size:13px;font-family:'Jost',sans-serif;font-weight:400;color:var(--ink);flex:1;}
  .cg-prop-type{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink4);font-family:'Jost',sans-serif;white-space:nowrap;}
  .cg-prop-date{font-size:11px;color:var(--ink3);white-space:nowrap;font-family:'Jost',sans-serif;}
  .cg-prop-edit{font-size:10px;padding:2px 10px;border-radius:20px;border:none;background:var(--navy);color:var(--champ);cursor:pointer;font-family:'Jost',sans-serif;font-weight:500;white-space:nowrap;opacity:0;transition:opacity .15s;}
  .cg-prop-row:hover .cg-prop-edit{opacity:1;}
  .view-toggle{display:flex;gap:6px;align-items:center;}
  .view-toggle-btn{font-size:11px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--paper);color:var(--ink3);cursor:pointer;font-family:'Jost',sans-serif;transition:all .2s;display:flex;align-items:center;gap:5px;}
  .view-toggle-btn.on{background:var(--navy);border-color:var(--navy);color:var(--champ);}

  /* STATUS COLORS */
  .status-active{background:#E8F5E9;color:#2E7D32;}
  .status-prospect{background:var(--champ-wash);color:#8B6914;}
  .status-past{background:var(--grey-bg);color:var(--grey-tx);}
  .status-hot{background:#FFEBEE;color:#C62828;}
  .status-closed{background:var(--navy);color:var(--champ);}

  /* CHECKBOX PILLS */
  .checkbox-pill{font-family:'Jost',sans-serif;font-size:11px;display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--paper);color:var(--ink3);cursor:pointer;margin:2px;transition:all .2s;}
  .checkbox-pill input{accent-color:var(--champ);}
  .checkbox-pill:has(input:checked){background:var(--champ-wash);border-color:var(--champ);color:var(--navy);}

  /* LOG */
  .log-entry{border-left:2px solid var(--border);padding:6px 0 6px 14px;margin-bottom:10px;}
  .log-entry .le-date{font-size:10px;color:var(--ink4);font-family:'Jost',sans-serif;letter-spacing:.04em;}
  .log-entry .le-text{font-size:13px;color:var(--ink);margin-top:2px;}

  /* CHECKLIST */
  .ck-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
  .ck-box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;cursor:pointer;}
  .ck-item.done .ck-box{background:var(--teal);border-color:var(--teal);}
  .ck-label{font-size:13px;flex:1;font-family:'Jost',sans-serif;font-weight:300;}
  .ck-item.done .ck-label{color:var(--ink3);text-decoration:line-through;}


  .filter-group{border-bottom:1px solid var(--border);padding:6px 0;}
  .filter-group:last-child{border-bottom:none;}
  .filter-group-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;cursor:pointer;font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--ink3);padding:6px 0;text-align:left;transition:color .2s;}
  .filter-group-toggle:hover{color:var(--ink);}
  .filter-group-toggle svg{transition:transform .25s;flex-shrink:0;}
  .filter-group-toggle.open{color:var(--champ);}
  .filter-group-toggle.open svg{transform:rotate(180deg);}

  /* FILTER CHIPS */
  .filter-row{margin:8px 6vw 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .fchip{background:transparent;border:1px solid var(--border);color:var(--ink3);font-size:11px;letter-spacing:.06em;font-family:'Jost',sans-serif;padding:5px 12px;border-radius:30px;cursor:pointer;transition:all .2s;font-weight:400;}
  .fchip:hover{border-color:var(--champ);}
  .fchip.on{background:var(--champ);color:var(--navy);border-color:var(--champ);font-weight:500;}

  /* ACTIVITY LOG */
  .chk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;}
  .chk.done{background:var(--teal);border-color:var(--teal);}
  .row-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
  .row-item:hover{border-color:var(--border);}
  .ri-main{flex:1;min-width:0;}
  .ri-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;}

  /* VERIFY BAR */
  .vbar{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
  .vbar .vtrack{flex:1;height:5px;background:var(--border);border-radius:5px;overflow:hidden;}
  .vbar .vfill{height:100%;background:var(--teal);border-radius:5px;transition:width .3s;}
  .verif{font-size:10px;padding:2px 8px;border-radius:20px;font-family:'Jost',sans-serif;font-weight:500;}
  .verif.low{background:var(--amber-bg);color:var(--amber-tx);}
  .verif.mid{background:var(--champ-wash);color:var(--navy);}
  .verif.ok{background:#E8F5E9;color:#2E7D32;}

  /* REFERRALS */
  .app-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 0;}
  .app-av{width:40px;height:40px;border-radius:50%;background:var(--champ-wash);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:12px;flex-shrink:0;font-family:'Jost',sans-serif;}
  .app-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow-sm);cursor:pointer;transition:all .2s;}
  .app-card:hover{border-color:var(--champ);transform:translateY(-1px);}

  /* TWO COL */
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:960px){.client-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media(max-width:600px){.two{grid-template-columns:1fr;}.client-grid{grid-template-columns:1fr;}.app-grid{grid-template-columns:1fr;}}

  /* EMPTY STATE */
  .empty-state{text-align:center;padding:60px 20px;color:var(--ink3);}
  .empty-state h3{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;color:var(--ink2);margin-bottom:8px;}
  .empty-state p{font-size:13px;line-height:1.6;}
</style>

function escapeHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function parseDate(mmddyyyy){
  if(!mmddyyyy) return null;
  const parts = String(mmddyyyy).split('/').map(Number);
  if(parts.length !== 3 || parts.some(isNaN)) return null;
  const [m,d,y] = parts;
  const dt = new Date(y, m-1, d);
  return isNaN(dt.getTime()) ? null : dt;
}
function fmtMonthDay(dt){ return dt.toLocaleString('en-US', {month:'long', day:'numeric'}); }
function fmtFull(dt){ return dt.toLocaleString('en-US', {month:'long', day:'numeric', year:'numeric'}); }
function fmtDateSlash(dt){
  const mm = String(dt.getMonth()+1).padStart(2,'0');
  const dd = String(dt.getDate()).padStart(2,'0');
  return `${mm}/${dd}/${dt.getFullYear()}`;
}
function todayDate(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function addDaysToToday(days){
  const d = todayDate();
  d.setDate(d.getDate() + days);
  return fmtDateSlash(d);
}
// Conversions between our stored MM/DD/YYYY text format and the native
// <input type="date"> ISO format, so date fields can use a real calendar
// picker while everything already saved stays in the same format.
function mmddyyyyToIso(s){
  const d = parseDate(s);
  if(!d) return '';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function isoToMmddyyyy(s){
  if(!s) return '';
  const parts = String(s).split('-');
  if(parts.length !== 3) return '';
  const [y,m,d] = parts;
  if(!y || !m || !d) return '';
  return `${m}/${d}/${y}`;
}
function suggestLeaseEnd(startStr, months){
  const start = parseDate(startStr);
  if(!start) return null;
  const y = start.getFullYear(), m = start.getMonth();
  return new Date(y, m + months + 1, 0);
}
function sortKeyMonthDay(mmddyyyy){
  const d = parseDate(mmddyyyy);
  return d ? [d.getMonth(), d.getDate()] : [99,99];
}
function isRepeat(note){ return /REPEAT CLIENT|JASSO FAMILY/i.test(note || ''); }
function daysBetween(a,b){ return Math.round((a-b)/86400000); }
function typeArr(r){ return Array.isArray(r.client_type) ? r.client_type : []; }

// ---------------------------------------------------------------------------
// Info Status auto-computation (Not Reviewed / Incomplete / Complete / Unable to Locate)
// ---------------------------------------------------------------------------
function hasHouseholdContact(r){
  return !!(r.owner1_email || r.owner1_phone || r.owner2_email || r.owner2_phone);
}
function computeAutoInfoStatus(r){
  const hasName = !!(r.owner1_name && r.owner1_name.trim());
  const hasContact = hasHouseholdContact(r);
  const hasType = typeArr(r).length > 0;
  const hasRelationship = !!(r.relationship_status && r.relationship_status.trim());
  if(hasName && hasContact && hasType && hasRelationship) return 'Complete';
  if(hasName || hasContact) return 'Incomplete';
  return 'Not Reviewed';
}
function missingFieldsList(r){
  const missing = [];
  if(!(r.owner1_name && r.owner1_name.trim())) missing.push('Client name');
  if(!hasHouseholdContact(r)) missing.push('Phone or email');
  if(!(typeArr(r).length)) missing.push('Client type');
  if(!(r.relationship_status && r.relationship_status.trim())) missing.push('Relationship status');
  return missing;
}

// ---------------------------------------------------------------------------
// Follow-up status (computed live from Next Follow-Up Date, with a manual override
// for Completed / No Follow-Up Needed since those can't be derived from a date alone)
// ---------------------------------------------------------------------------
const FOLLOWUP_OVERRIDE_OPTIONS = ['Contacted','Left a Message','No Answer','Completed','No Follow-Up Needed'];
function computeFollowUpStatus(r){
  if(r.follow_up_status_override) return r.follow_up_status_override;
  const d = parseDate(r.next_follow_up_date);
  if(!d) return 'Not Scheduled';
  const days = daysBetween(d, todayDate());
  if(days < 0) return 'Overdue';
  if(days === 0) return 'Due Today';
  return 'Scheduled';
}

let upcomingWindow = 60;
let upcomingExpanded = false;

function parseMonthDay(str){
  if(!str) return null;
  const parts = String(str).trim().split('/').map(Number);
  if(parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) return null;
  const [m,d] = parts;
  if(m<1||m>12||d<1||d>31) return null;
  return {month:m, day:d};
}
function nextOccurrence(month, day, today){
  const y = today.getFullYear();
  let dt = new Date(y, month-1, day);
  if(dt < today) dt = new Date(y+1, month-1, day);
  return dt;
}
function computeUpcoming(windowDays){
  const today = todayDate();
  const items = [];
  records.forEach(r=>{
    const rental = isRentalRole(r.role);
    if(!rental){
      const md = parseMonthDay(r.sold_date);
      if(md){
        const next = nextOccurrence(md.month, md.day, today);
        const days = daysBetween(next, today);
        if(days <= windowDays) items.push({icon:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`, label:'Anniversary', name:r.owner1_name||'Home anniversary', sub:r.address, date:next, days, record:r});
      }
    } else {
      const end = parseDate(r.lease_end_date);
      if(end){
        const days = daysBetween(end, today);
        if(days <= windowDays) items.push({icon:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`, label: days<0 ? 'Lease expired' : 'Lease expires', name:r.owner1_name||r.address, sub:r.address, date:end, days, record:r});
      }
    }
    [['owner1_name','owner1_birthday'],['owner2_name','owner2_birthday']].forEach(([nameKey,bdayKey])=>{
      const md = parseMonthDay(r[bdayKey]);
      if(md && r[nameKey]){
        const next = nextOccurrence(md.month, md.day, today);
        const days = daysBetween(next, today);
        if(days <= windowDays) items.push({icon:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20"/><path d="M7 8v2"/><path d="M12 8v2"/><path d="M17 8v2"/><path d="M7 4h.01"/><path d="M12 4h.01"/><path d="M17 4h.01"/></svg>`, label:'Birthday', name:r[nameKey], sub:r.address, date:next, days, record:r});
      }
    });
    const followDays = (()=>{
      const d = parseDate(r.next_follow_up_date);
      if(!d) return null;
      return daysBetween(d, today);
    })();
    if(followDays !== null && followDays <= windowDays && computeFollowUpStatus(r) !== 'Completed' && computeFollowUpStatus(r) !== 'No Follow-Up Needed'){
      items.push({icon:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`, label: followDays<0 ? 'Follow-up overdue' : 'Follow-up due', name:r.owner1_name||r.address, sub:r.address, date:parseDate(r.next_follow_up_date), days:followDays, record:r});
    }
  });
  items.sort((a,b)=>{
    const aOver = a.days<0, bOver = b.days<0;
    if(aOver && !bOver) return -1;
    if(!aOver && bOver) return 1;
    if(aOver && bOver) return b.days - a.days;
    return a.days - b.days;
  });
  return items;
}
function upcomingWindowSelectHtml(){
  return `<label class="upcoming-window-label">Next
    <select id="upcomingWindowSel">
      <option value="30" ${upcomingWindow===30?'selected':''}>30 days</option>
      <option value="60" ${upcomingWindow===60?'selected':''}>60 days</option>
      <option value="90" ${upcomingWindow===90?'selected':''}>90 days</option>
    </select></label>`;
}
function renderUpcoming(){
  const wrap = document.getElementById('upcoming');
  if(!wrap) return;
  const items = computeUpcoming(upcomingWindow);
  if(items.length === 0){
    wrap.innerHTML = `
      <div class="upcoming-head">
        <div class="upcoming-title">Coming Up</div>
        ${upcomingWindowSelectHtml()}
      </div>
      <div class="upcoming-empty">Nothing due in the next ${upcomingWindow} days.</div>
    `;
    wireUpcomingEvents();
    return;
  }
  const collapsed = !upcomingExpanded && items.length > 6;
  const shown = collapsed ? items.slice(0,6) : items;
  wrap.innerHTML = `
    <div class="upcoming-head">
      <div class="upcoming-title">Coming Up<span class="upcoming-count">${items.length}</span></div>
      ${upcomingWindowSelectHtml()}
    </div>
    <div class="upcoming-list">
      ${shown.map(it=>{
        const urgency = it.days<0 ? 'urgent' : it.days<=7 ? 'urgent' : it.days<=30 ? 'soon' : '';
        const dayLabel = it.days<0 ? `${Math.abs(it.days)}d overdue` : it.days===0 ? 'Today' : it.days===1 ? 'Tomorrow' : `in ${it.days}d`;
        return `
        <div class="upcoming-row" data-mls="${escapeHtml(it.record.mls_number)}">
          <span class="up-icon">${it.icon}</span>
          <span class="up-label">${it.label}</span>
          <span class="up-name">${escapeHtml(it.name)}</span>
          <span class="up-sub">${escapeHtml(it.sub||'')}</span>
          <span class="up-date">${fmtMonthDay(it.date)}</span>
          <span class="up-days ${urgency}">${dayLabel}</span>
        </div>`;
      }).join('')}
    </div>
    ${items.length > 6 ? `<button class="upcoming-toggle" id="upcomingToggle">${collapsed ? `Show ${items.length-6} more` : 'Show less'}</button>` : ''}
  `;
  wireUpcomingEvents();
}
function wireUpcomingEvents(){
  const sel = document.getElementById('upcomingWindowSel');
  if(sel) sel.addEventListener('change', e=>{ upcomingWindow = Number(e.target.value); upcomingExpanded = false; renderUpcoming(); });
  const toggle = document.getElementById('upcomingToggle');
  if(toggle) toggle.addEventListener('click', ()=>{ upcomingExpanded = !upcomingExpanded; renderUpcoming(); });
  document.querySelectorAll('.upcoming-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const mls = row.dataset.mls;
      openRecordForEdit(mls);

}

async function loadActivityLogs(){
  const { data, error } = await sb.from(LOG_TABLE).select('*').order('created_at', {ascending:false});
  if(error) return;
  activityLogs = {};
  data.forEach(entry=>{
    if(!activityLogs[entry.mls_number]) activityLogs[entry.mls_number] = [];
    activityLogs[entry.mls_number].push(entry);
  });
}
async function addActivityLogEntry(mls, entry){
  const payload = {
    mls_number: mls,
    entry_date: entry.entry_date || fmtDateSlash(new Date()),
    entry_time: entry.entry_time || '',
    user_name: entry.user_name || 'Jeannette',
    activity_type: entry.activity_type || 'Other',
    description: entry.description || '',
    related_property: entry.related_property || '',
    previous_value: entry.previous_value || '',
    new_value: entry.new_value || '',
    follow_up_date: entry.follow_up_date || ''
  };
  const { data, error } = await sb.from(LOG_TABLE).insert(payload).select();
  if(!error && data && data[0]){
    if(!activityLogs[mls]) activityLogs[mls] = [];
    activityLogs[mls].unshift(data[0]);
  }
  return !error;
}
function activityLogHtml(mls){
  const entries = activityLogs[mls] || [];
  if(!entries.length) return '<div class="activity-empty">No activity logged yet.</div>';
  return entries.map(e=>{
    const diff = (e.previous_value || e.new_value) ? `<div class="ae-diff">${escapeHtml(e.previous_value ? `Was: ${e.previous_value} → ` : '')}${escapeHtml(e.new_value ? `Now: ${e.new_value}` : '')}</div>` : '';
    return `
      <div class="activity-entry">
        <div class="ae-head"><span>${escapeHtml(e.activity_type)}</span><span>${escapeHtml(e.entry_date)}${e.entry_time ? ' · '+escapeHtml(e.entry_time) : ''} — ${escapeHtml(e.user_name)}</span></div>
        <div class="ae-body">${escapeHtml(e.description)}${e.related_property ? ` (${escapeHtml(e.related_property)})` : ''}</div>
        ${diff}
        ${e.follow_up_date ? `<div class="ae-diff">Follow-up scheduled: ${escapeHtml(e.follow_up_date)}</div>` : ''}
      </div>
    `;
  }).join('');
}

async function loadData(){
  setSyncStatus('Syncing…');
  const { data, error } = await sb.from(TABLE).select('*');
  if(error){
    setSyncStatus('Offline — could not load', true);
    document.getElementById('list').innerHTML = '<div class="empty-state">Could not connect to load live data. Check your connection and refresh the page.</div>';
    return;
  }
  records = data.sort((a,b)=> (parseDate(b.sold_date)||new Date(0)) - (parseDate(a.sold_date)||new Date(0)));

  setSyncStatus('Live — edits save automatically');

  renderQuickViews();
  updateStats();
  renderUpcoming();
  renderMainView();
}

function updateStats(){
  const el = document.getElementById('stats');
  const c = {'Not Reviewed':0,'Incomplete':0,'Complete':0,'Unable to Locate':0};
  records.forEach(r=> c[r.client_info_status] = (c[r.client_info_status]||0)+1 );
  el.innerHTML = `
    <div class="stat-card"><div class="num">${records.length}</div><div class="lbl">Total Clients</div></div>
    <div class="stat-card tone-green"><div class="num">${c['Complete']}</div><div class="lbl">Complete</div></div>
    <div class="stat-card tone-amber"><div class="num">${c['Incomplete']}</div><div class="lbl">Incomplete</div></div>
    <div class="stat-card tone-grey"><div class="num">${c['Not Reviewed']}</div><div class="lbl">Not Reviewed</div></div>
    <div class="stat-card tone-red"><div class="num">${c['Unable to Locate']}</div><div class="lbl">Unable to Locate</div></div>
  `;
}

function ownerBlockHtml(name, email, phone, bday, label){
  if(!name && !email && !phone && !bday){
    return `<div class="owner-block empty">No ${label} on file</div>`;
  }
  const lines = [];
  if(email) lines.push(`<div class="o-line"><a href="mailto:${email}">${escapeHtml(email)}</a></div>`);
  if(phone) lines.push(`<div class="o-line"><a href="tel:${phone.replace(/[^0-9+]/g,'')}">${escapeHtml(phone)}</a></div>`);
  if(bday) lines.push(`<div class="o-bday">${escapeHtml(bday)}</div>`);
  return `
    <div class="owner-block">
      <div class="o-label">${label}</div>
      <div class="o-name">${name ? escapeHtml(name) : '<span style="color:var(--muted);font-weight:400;font-style:italic;">Name unknown</span>'}</div>
      ${lines.join('')}
    </div>
  `;
}

function dateBadgeHtml(r){
  const rental = isRentalRole(r.role);
  if(!rental){
    const d = parseDate(r.sold_date);
    if(!d) return '';
    return `<div class="datebadge"> Home anniversary: ${fmtMonthDay(d)}</div>`;
  }
  const start = parseDate(r.sold_date);
  const end = parseDate(r.lease_end_date);
  const parts = [];
  if(start) parts.push(`Lease started ${fmtFull(start)}`);
  if(end){
    const daysLeft = daysBetween(end, todayDate());
    const warn = daysLeft <= 60;
    parts.push(`<span class="${warn?'lease-warn':''}">Lease expires ${fmtFull(end)}${warn && daysLeft>=0 ? ` (${daysLeft}d)` : ''}</span>`);
  } else {
    const estimate = suggestLeaseEnd(r.sold_date, 12);
    if(estimate){
      parts.push(`<span class="lease-missing">Est. lease expires ${fmtFull(estimate)} (12-mo. default — confirm in Edit)</span>`);
    } else {
      parts.push('<span class="lease-missing">Add lease end date</span>');
    }
  }
  return `<div class="datebadge${end && daysBetween(end, todayDate()) <= 60 ? ' lease-warn' : ''}"> ${parts.join(' · ')}</div>`;
}

function followUpRowHtml(r){
  const status = computeFollowUpStatus(r);
  const parts = [];
  if(r.last_contact_date) parts.push(`Last contact: ${escapeHtml(r.last_contact_date)}`);
  if(r.next_follow_up_date) parts.push(`Next follow-up: ${escapeHtml(r.next_follow_up_date)}${r.assigned_agent ? ' ('+escapeHtml(r.assigned_agent)+')' : ''}`);
  if(!parts.length && status==='Not Scheduled') return '';
  return `<div class="followup-row"><span class="followup-pill badge ${toneOf(status)}">${escapeHtml(status)}</span>${parts.join(' &middot; ')}</div>`;
}

function badgesHtml(r){
  const types = typeArr(r);
  return `
    <span class="badge ${toneOf(r.client_info_status)}">${escapeHtml(r.client_info_status)}</span>
    <span class="badge ${toneOf(r.relationship_status)}">${escapeHtml(r.relationship_status||'—')}</span>
    ${types.length ? `<span class="type-pills">${types.map(t=>`<span class="role-pill">${escapeHtml(t)}</span>`).join('')}</span>` : ''}
    <span class="badge ${toneOf(r.property_status)}">${escapeHtml(r.property_status||'Unknown')}</span>
  `;
}

// ---------------------------------------------------------------------------
// Main list rendering (Clients view) vs The List (table view)
// ---------------------------------------------------------------------------
function matchesSearch(r, term){
  if(!term) return true;
  const hay = `${r.address} ${r.city} ${r.mls_number} ${r.owner1_name} ${r.owner2_name} ${r.owner1_email} ${r.owner2_email} ${r.client_note}`.toLowerCase();
  return hay.includes(term);
}
function filteredRecords(){
  const term = searchTerm.trim().toLowerCase();
  let filtered = records.filter(r=>{
    if(activeQuickView){
      const qv = QUICK_VIEWS.find(q=>q.key===activeQuickView);
      if(qv && !qv.test(r)) return false;
    } else {
      if(filterInfo !== 'all' && r.client_info_status !== filterInfo) return false;
      if(filterRelationship !== 'all' && r.relationship_status !== filterRelationship) return false;
      if(filterType !== 'all' && !typeArr(r).includes(filterType)) return false;
      if(filterPropStatus !== 'all' && (r.property_status||'Unknown') !== filterPropStatus) return false;
    }
    if(!matchesSearch(r, term)) return false;
    return true;
  });

  if(sortMode === 'anniv'){
    filtered = filtered.slice().sort((a,b)=>{
      const aKey = isRentalRole(a.role) ? sortKeyMonthDay(a.lease_end_date || a.sold_date) : sortKeyMonthDay(a.sold_date);
      const bKey = isRentalRole(b.role) ? sortKeyMonthDay(b.lease_end_date || b.sold_date) : sortKeyMonthDay(b.sold_date);
      return aKey[0]-bKey[0] || aKey[1]-bKey[1];
    });
  } else if(sortMode === 'followup'){
    filtered = filtered.slice().sort((a,b)=>{
      const da = parseDate(a.next_follow_up_date), db = parseDate(b.next_follow_up_date);
      if(!da && !db) return 0;
      if(!da) return 1;
      if(!db) return -1;
      return da - db;
    });
  } else {
    filtered = filtered.slice().sort((a,b)=> (parseDate(b.sold_date)||new Date(0)) - (parseDate(a.sold_date)||new Date(0)));
  }
  return filtered;
}

function renderMainView(){
  const isClients = currentView === 'clients';
  const isTheList = currentView === 'thelist';
  const isReferrals = currentView === 'referrals';
  document.getElementById('upcoming').style.display = isClients ? '' : 'none';
  document.getElementById('stats').style.display = isClients ? '' : 'none';
  document.getElementById('quickviews').style.display = isClients ? '' : 'none';
  document.getElementById('controlsActions').style.display = isClients ? '' : 'none';
  document.getElementById('filterRows').style.display = isClients ? '' : 'none';
  document.getElementById('resultCountWrap').style.display = isClients ? '' : 'none';
  document.getElementById('list').style.display = isClients ? '' : 'none';
  document.getElementById('theListWrap').style.display = isTheList ? '' : 'none';
  document.getElementById('referralsWrap').style.display = isReferrals ? '' : 'none';
  if(isClients) render();
  else if(isTheList) renderTheList();
  else renderReferrals();
}

function render(){
  const list = document.getElementById('list');
  const filtered = filteredRecords();

  document.getElementById('resultCount').textContent = filtered.length < records.length ? `${filtered.length} of ${records.length}` : `${records.length} total`;

  if(filtered.length === 0 && !addingNew){
    list.innerHTML = '<div class="empty-state"><h3>No matches</h3><p>Try a different search or filter.</p></div>';
    return;
  }
  if(viewMode === 'grouped' && !addingNew){ renderGrouped(filteredRecords()); return; }
  if(viewMode === 'property' && !addingNew){ renderByProperty(filteredRecords()); return; }

  const cardsHtml = filtered.map(r=>{
    if(r.mls_number === editingMls) return renderEditCard(r);
    const repeat = isRepeat(r.client_note);
    const noteHtml = r.client_note ? `<div class="note-row ${repeat?'repeat':''}">${escapeHtml(r.client_note)}</div>` : '';
    const logExpanded = expandedLogMls === r.mls_number;
    const relStatus = r.relationship_status || '';
    const statusClass = relStatus === 'Active Client' ? 'status-active' : relStatus === 'Hot Lead' ? 'status-hot' : relStatus === 'Past Client' ? 'status-past' : 'status-prospect';
    return `
      <div class="client-card ${repeat ? 'repeat-client':''}">
        <div class="cc-top">
          <div>
            <div class="cc-name">${escapeHtml(r.owner1_name || r.address || '—')}</div>
            <div class="cc-type">${escapeHtml(r.transaction_type||'')}${r.city ? ' · ' + escapeHtml(r.city) : ''}</div>
          </div>
          <span class="cc-status ${statusClass}">${escapeHtml(relStatus||'Contact')}</span>
        </div>
        <div class="cc-address">${escapeHtml(r.address||'')}</div>
        <div class="cc-meta">
          ${r.sold_date ? `<span class="cc-tag">Closed ${escapeHtml(r.sold_date)}</span>` : ''}
          ${r.mls_number ? `<span class="cc-tag">MLS# ${escapeHtml(r.mls_number)}</span>` : ''}
          ${(typeArr(r)||[]).map(t=>`<span class="cc-tag">${escapeHtml(t)}</span>`).join('')}
        </div>
        ${r.client_note ? `<div style="font-size:12px;color:var(--ink3);margin-top:8px;font-style:italic;line-height:1.5;">${escapeHtml(r.client_note)}</div>` : ''}
        <div class="cc-foot">
          <div class="cc-next">
            ${r.next_follow_up_date ? `Next contact <b>${escapeHtml(r.next_follow_up_date)}</b>` : '<span style="color:var(--ink4)">No follow-up set</span>'}
          </div>
          <div style="display:flex;gap:6px;align-items:center;">
            <button class="log-toggle-btn" style="font-size:10px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--ink3);cursor:pointer;font-family:'Jost',sans-serif;transition:all .2s;" data-log-toggle="${escapeHtml(r.mls_number)}" onmouseover="this.style.borderColor='var(--champ)'" onmouseout="this.style.borderColor='var(--border)'">${logExpanded ? 'Hide' : 'Log'} (${(activityLogs[r.mls_number]||[]).length})</button>
            <button class="edit-btn" style="font-size:10px;padding:3px 12px;border-radius:20px;border:none;background:var(--navy);color:var(--champ);cursor:pointer;font-family:'Jost',sans-serif;font-weight:500;" onclick="openEditDrawer('${escapeHtml(r.mls_number)}')" style="font-size:10px;padding:3px 12px;border-radius:20px;border:none;background:var(--navy);color:var(--champ);cursor:pointer;font-family:'Jost',sans-serif;font-weight:500;">Edit</button>
          </div>
        </div>
        ${logExpanded ? `<div class="activity-log" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">${activityLogHtml(r.mls_number)}</div>` : ''}
        ${r.owner2_name ? `<div style="font-size:11px;color:var(--ink3);margin-top:6px;padding-top:6px;border-top:1px solid var(--border);">${escapeHtml(r.owner2_name)}</div>` : ''}
      </div>
    `;
  }).join('');

  list.innerHTML = `<div class="client-grid">${(addingNew ? renderNewCard() : "") + cardsHtml}</div>`;

  list.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editingMls = btn.dataset.edit;
      addingNew = false;
      infoOverrideChecked = false;
      render();
      const card = list.querySelector('.card.editing');
      if(card) card.scrollIntoView({behavior:'smooth', block:'center'});
    });
  });
  list.querySelectorAll('[data-log-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const mls = btn.dataset.logToggle;
      expandedLogMls = expandedLogMls === mls ? null : mls;
      render();
    });
  });
  wireEditCardEvents();
  wireNewCardEvents();
}

function renderTheList(){
  const wrap = document.getElementById('theListWrap');
  const term = searchTerm.trim().toLowerCase();
  const eligibleAll = records.filter(isTheListEligible).filter(r=>matchesSearch(r, term));

  const statusCounts = {};
  THE_LIST_STATUSES.forEach(s=> statusCounts[s]=0 );
  statusCounts['__blank__'] = 0;
  eligibleAll.forEach(r=>{
    const v = r.the_list_status;
    if(v && THE_LIST_STATUSES.includes(v)) statusCounts[v]++;
    else statusCounts['__blank__']++;
  });

  const eligible = eligibleAll.filter(r=>{
    if(filterTheListStatus === 'all') return true;
    if(filterTheListStatus === '__blank__') return !r.the_list_status;
    return r.the_list_status === filterTheListStatus;
  }).slice().sort((a,b)=>{
    const da = parseDate(a.next_follow_up_date), db = parseDate(b.next_follow_up_date);
    if(!da && !db) return 0;
    if(!da) return 1;
    if(!db) return -1;
    return da - db;
  });

  const filterBtnsHtml = `
    <div class="thelist-filters" id="thelistFilters">
      <span class="grp-label ui">The List Status</span>
      <button class="filter-btn ${filterTheListStatus==='all'?'active':''}" data-tlval="all">All (${eligibleAll.length})</button>
      <button class="filter-btn ${filterTheListStatus==='__blank__'?'active':''}" data-tlval="__blank__">Not Set (${statusCounts['__blank__']})</button>
      ${THE_LIST_STATUSES.map(s=>`<button class="filter-btn ${filterTheListStatus===s?'active':''}" data-tlval="${s}">${s} (${statusCounts[s]})</button>`).join('')}
    </div>
    <div class="thelist-count">Showing ${eligible.length} of ${eligibleAll.length} on The List</div>
  `;

  if(!eligibleAll.length){
    wrap.innerHTML = `<div class="empty-state">${term ? 'No matches on The List for that search.' : 'No past clients, investors, sphere contacts, or referral partners yet.'}</div>`;
    return;
  }
  if(!eligible.length){
    wrap.innerHTML = filterBtnsHtml + '<div class="empty-state">No records match this The List status filter.</div>';
    wireTheListFilterButtons(wrap);
    return;
  }

  wrap.innerHTML = filterBtnsHtml + `
    <table class="thelist-table">
      <thead><tr>
        <th>Client</th><th>Property</th><th>Txn Date</th><th>Type</th><th>Last Contact</th><th>Next Follow-Up</th>
        <th>Info Status</th><th>Relationship</th><th>Annual Review</th><th>Notes</th><th>Assigned</th><th>The List Status</th><th></th>
      </tr></thead>
      <tbody>
        ${eligible.map(r=>`
          <tr data-mls="${escapeHtml(r.mls_number)}">
            <td>${escapeHtml(r.owner1_name || 'Name unknown')}</td>
            <td>${escapeHtml(r.address)}</td>
            <td>${escapeHtml(r.sold_date||'—')}</td>
            <td>${escapeHtml(r.transaction_type||'')}</td>
            <td>${escapeHtml(r.last_contact_date||'—')}</td>
            <td>${escapeHtml(r.next_follow_up_date||'—')}</td>
            <td><span class="badge ${toneOf(r.client_info_status)}">${escapeHtml(r.client_info_status)}</span></td>
            <td><span class="badge ${toneOf(r.relationship_status)}">${escapeHtml(r.relationship_status)}</span></td>
            <td>${escapeHtml(r.annual_review_status||'Not Applicable')}</td>
            <td style="max-width:180px;">${escapeHtml((r.client_note||'').slice(0,80))}</td>
            <td>${escapeHtml(r.assigned_agent||'')}</td>
            <td>
              <select class="the-list-status-sel" data-mls="${escapeHtml(r.mls_number)}">
                ${THE_LIST_STATUSES.map(s=>`<option value="${s}" ${r.the_list_status===s?'selected':''}>${s}</option>`).join('')}
                <option value="" ${!r.the_list_status?'selected':''}>—</option>
              </select>
            </td>
            <td>
              <button class="thelist-action-btn" data-logcall="${escapeHtml(r.mls_number)}">Log Call</button>
              <button class="thelist-link" data-open="${escapeHtml(r.mls_number)}" style="margin-left:8px;">Open</button>
            </td>
          </tr>
          ${logContactMls===r.mls_number && logContactMode==='call' ? logContactFormHtml(r, 'call') : ''}
        `).join('')}
      </tbody>
    </table>
  `;

  wrap.querySelectorAll('.the-list-status-sel').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const mls = sel.dataset.mls;
      const val = sel.value;
      const rec = records.find(r=>r.mls_number===mls);
      const prev = rec ? rec.the_list_status : '';
      const { error } = await sb.from(TABLE).update({the_list_status: val, updated_at: new Date().toISOString()}).eq('mls_number', mls);
      if(error){ showToast('Could not update — please try again', true); return; }
      if(rec) rec.the_list_status = val;
      await addActivityLogEntry(mls, {activity_type:'Status Changed', description:'The List status updated.', related_property: rec ? rec.address : '', previous_value: prev, new_value: val});
      showToast('Saved');
      renderTheList();
    });
  });
  wrap.querySelectorAll('[data-logcall]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      logContactMls = btn.dataset.logcall;
      logContactMode = 'call';
      renderTheList();
    });
  });
  wrap.querySelectorAll('[data-open]').forEach(btn=>{
    btn.addEventListener('click', ()=> openRecordForEdit(btn.dataset.open));
  });
  wireTheListFilterButtons(wrap);
  wireLogContactForm(wrap, renderTheList);
}

function wireTheListFilterButtons(wrap){
  wrap.querySelectorAll('#thelistFilters .filter-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      filterTheListStatus = btn.dataset.tlval;
      renderTheList();
    });
  });
}

// ---------------------------------------------------------------------------
// Shared inline "Log Call" / "Log Result" form — used by both The List and
// Referrals & Leads. Writes to the SAME record and the SAME Activity Log used
// everywhere else in the dashboard, so nothing is ever duplicated: Last
// Contact Date, Next Follow-Up Date, and one permanent log entry are all this
// writes.
// ---------------------------------------------------------------------------
function logContactFormHtml(r, mode){
  const isResult = mode === 'result';
  return `
    <tr class="log-contact-row">
      <td colspan="20">
        <div class="log-contact-form">
          <div class="lcf-title">${isResult ? 'Log Result' : 'Log Call'} — ${escapeHtml(r.owner1_name || 'Name unknown')}</div>
          <div class="lcf-grid">
            <label>Contact Method
              <select class="lcf-method">${CONTACT_ACTIVITY_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('')}</select>
            </label>
            ${isResult ? `
            <label>Result
              <select class="lcf-result">
                <option value="">— Select a result —</option>
                ${REFERRAL_RESULTS.map(res=>`<option value="${res.key}">${res.label}</option>`).join('')}
              </select>
            </label>` : ''}
            <label>Next Follow-Up
              <input type="date" class="lcf-nextfollowup" value="${mmddyyyyToIso(r.next_follow_up_date)}">
            </label>
          </div>
          <label class="lcf-notes-label">Notes
            <textarea class="lcf-notes" rows="2" placeholder="What did you talk about?"></textarea>
          </label>
          <div class="lcf-actions">
            <button class="thelist-action-btn lcf-new-lead" type="button">+ New Lead From This Call</button>
            <span style="flex:1;"></span>
            <button class="btn-pill ui lcf-cancel" type="button">Cancel</button>
            <button class="btn-pill primary ui lcf-save" type="button">Save</button>
          </div>
        </div>
      </td>
    </tr>
  `;
}
function wireLogContactForm(wrap, rerender){
  const formRow = wrap.querySelector('.log-contact-row');
  if(!formRow) return;
  const mls = logContactMls;
  const resultSel = formRow.querySelector('.lcf-result');
  const nextInput = formRow.querySelector('.lcf-nextfollowup');
  if(resultSel){
    resultSel.addEventListener('change', ()=>{
      const res = REFERRAL_RESULTS.find(x=>x.key===resultSel.value);
      if(res && res.days != null) nextInput.value = mmddyyyyToIso(addDaysToToday(res.days));
    });
  }
  formRow.querySelector('.lcf-cancel').addEventListener('click', ()=>{
    logContactMls = null; logContactMode = null;
    rerender();
  });

  async function saveLogContact(){
    const rec = records.find(r=>r.mls_number===mls);
    if(!rec) return null;
    const method = formRow.querySelector('.lcf-method').value;
    const notes = formRow.querySelector('.lcf-notes').value.trim();
    const nextFollowUp = isoToMmddyyyy(nextInput.value);
    const resultKey = resultSel ? resultSel.value : '';
    const resultObj = REFERRAL_RESULTS.find(x=>x.key===resultKey);
    const todayStr = fmtDateSlash(new Date());
    const prevNext = rec.next_follow_up_date;

    const updates = { last_contact_date: todayStr, next_follow_up_date: nextFollowUp, updated_at: new Date().toISOString() };
    const { error } = await sb.from(TABLE).update(updates).eq('mls_number', mls);
    if(error){ showToast('Could not save — please try again', true); return null; }
    Object.assign(rec, updates);

    const desc = `${notes || ('Logged ' + method.toLowerCase() + '.')}${resultObj ? ' — Result: ' + resultObj.label : ''}`;
    await addActivityLogEntry(mls, {
      activity_type: method,
      description: desc,
      related_property: rec.address,
      previous_value: prevNext ? `Next follow-up: ${prevNext}` : '',
      new_value: nextFollowUp ? `Next follow-up: ${nextFollowUp}` : '',
      follow_up_date: nextFollowUp
    });

    showToast('Saved');

    if(resultObj && resultObj.key === 'became-client' && rec.relationship_status !== 'Active Client'){
      const prevRel = rec.relationship_status;
      showConfirmModal(
        'Update Relationship Status?',
        `Mark ${rec.owner1_name || 'this contact'} as an Active Client now that they've moved forward?`,
        'Yes, Make Active',
        async (confirmed)=>{
          if(confirmed){
            const { error: err2 } = await sb.from(TABLE).update({relationship_status:'Active Client', updated_at: new Date().toISOString()}).eq('mls_number', mls);
            if(!err2){
              rec.relationship_status = 'Active Client';
              await addActivityLogEntry(mls, {activity_type:'Status Changed', description:`Relationship Status changed from ${prevRel} to Active Client.`, related_property: rec.address, previous_value: prevRel, new_value:'Active Client'});
              showToast('Updated to Active Client');
            }
          }
          rerender();
        }
      );
    }
    return rec;
  }

  formRow.querySelector('.lcf-save').addEventListener('click', async ()=>{
    const rec = await saveLogContact();
    if(!rec) return;
    logContactMls = null; logContactMode = null;
    rerender();
  });

  formRow.querySelector('.lcf-new-lead').addEventListener('click', async ()=>{
    const rec = records.find(r=>r.mls_number===mls);
    if(!rec) return;
    await saveLogContact();
    logContactMls = null; logContactMode = null;
    openAddLead({ relationship_status:'Warm Lead', referred_by: rec.owner1_name || '' });
  });
}

// ---------------------------------------------------------------------------
// Referrals & Leads workflow view (table) — prospects and referral-sourced
// contacts who have not yet become clients. Same shared records array as the
// other two tabs; logging a result here updates the same record everyone
// else sees, and appends to the same permanent Activity Log.
// ---------------------------------------------------------------------------
function renderReferrals(){
  const wrap = document.getElementById('referralsWrap');
  const term = searchTerm.trim().toLowerCase();
  const eligibleAll = records.filter(isReferralLeadEligible).filter(r=>matchesSearch(r, term));

  const FOLLOWUP_STATUSES = ['Not Scheduled','Scheduled','Due Today','Overdue', ...FOLLOWUP_OVERRIDE_OPTIONS];
  const statusCounts = {};
  FOLLOWUP_STATUSES.forEach(s=> statusCounts[s]=0 );
  eligibleAll.forEach(r=> statusCounts[computeFollowUpStatus(r)]++ );

  const eligible = eligibleAll.filter(r=>{
    if(filterReferralFollowUp === 'all') return true;
    return computeFollowUpStatus(r) === filterReferralFollowUp;
  }).slice().sort((a,b)=>{
    const da = parseDate(a.next_follow_up_date), db = parseDate(b.next_follow_up_date);
    if(!da && !db) return 0;
    if(!da) return 1;
    if(!db) return -1;
    return da - db;
  });

  const addLeadBtnHtml = `<div style="margin:26px 6vw 0;"><button class="btn-pill primary ui" id="addLeadBtn">+ Add Lead</button></div>`;

  const filterBtnsHtml = `
    <div class="thelist-filters" id="referralsFilters" style="margin-top:14px;">
      <span class="grp-label ui">Follow-Up Status</span>
      <button class="filter-btn ${filterReferralFollowUp==='all'?'active':''}" data-rfval="all">All (${eligibleAll.length})</button>
      ${FOLLOWUP_STATUSES.map(s=>`<button class="filter-btn ${filterReferralFollowUp===s?'active':''}" data-rfval="${s}">${s} (${statusCounts[s]})</button>`).join('')}
    </div>
    <div class="thelist-count">Showing ${eligible.length} of ${eligibleAll.length} referrals &amp; leads</div>
  `;

  if(!eligibleAll.length){
    wrap.innerHTML = addLeadBtnHtml + `<div class="empty-state">${term ? 'No matches on Referrals & Leads for that search.' : 'No prospects or referral-sourced leads yet — click "+ Add Lead" above, or one will appear automatically when you set Relationship Status to Prospect / Warm Lead, or Client Type to Referral.'}</div>`;
    wireAddLeadButton(wrap);
    return;
  }
  if(!eligible.length){
    wrap.innerHTML = addLeadBtnHtml + filterBtnsHtml + '<div class="empty-state">No records match this Follow-Up Status filter.</div>';
    wireAddLeadButton(wrap);
    wireReferralsFilterButtons(wrap);
    return;
  }

  wrap.innerHTML = addLeadBtnHtml + filterBtnsHtml + `
    <table class="thelist-table">
      <thead><tr>
        <th>Client</th><th>Source / Property</th><th>Referred By</th><th>Client Type</th><th>Relationship</th><th>Info Status</th>
        <th>Last Contact</th><th>Next Follow-Up</th><th>Notes</th><th>Assigned</th><th></th>
      </tr></thead>
      <tbody>
        ${eligible.map(r=>`
          <tr data-mls="${escapeHtml(r.mls_number)}">
            <td>${escapeHtml(r.owner1_name || 'Name unknown')}</td>
            <td>${escapeHtml(r.address || 'No linked property')}</td>
            <td>${escapeHtml(r.referred_by || '—')}</td>
            <td>${typeArr(r).map(t=>`<span class="role-pill">${escapeHtml(t)}</span>`).join(' ') || '—'}</td>
            <td><span class="badge ${toneOf(r.relationship_status)}">${escapeHtml(r.relationship_status||'—')}</span></td>
            <td><span class="badge ${toneOf(r.client_info_status)}">${escapeHtml(r.client_info_status)}</span></td>
            <td>${escapeHtml(r.last_contact_date||'—')}</td>
            <td><span class="badge ${toneOf(computeFollowUpStatus(r))}">${escapeHtml(r.next_follow_up_date || computeFollowUpStatus(r))}</span></td>
            <td style="max-width:180px;">${escapeHtml((r.client_note||'').slice(0,80))}</td>
            <td>${escapeHtml(r.assigned_agent||'')}</td>
            <td>
              <button class="thelist-action-btn" data-logresult="${escapeHtml(r.mls_number)}">Log Result</button>
              <button class="thelist-link" data-open="${escapeHtml(r.mls_number)}" style="margin-left:8px;">Open</button>
            </td>
          </tr>
          ${logContactMls===r.mls_number && logContactMode==='result' ? logContactFormHtml(r, 'result') : ''}
        `).join('')}
      </tbody>
    </table>
  `;

  wrap.querySelectorAll('[data-logresult]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      logContactMls = btn.dataset.logresult;
      logContactMode = 'result';
      renderReferrals();
    });
  });
  wrap.querySelectorAll('[data-open]').forEach(btn=>{
    btn.addEventListener('click', ()=> openRecordForEdit(btn.dataset.open));
  });
  wireAddLeadButton(wrap);
  wireReferralsFilterButtons(wrap);
  wireLogContactForm(wrap, renderReferrals);
}
function wireAddLeadButton(wrap){
  const btn = wrap.querySelector('#addLeadBtn');
  if(btn) btn.addEventListener('click', ()=> openAddLead({ relationship_status:'Warm Lead' }));
}
function wireReferralsFilterButtons(wrap){
  wrap.querySelectorAll('#referralsFilters .filter-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      filterReferralFollowUp = btn.dataset.rfval;
      renderReferrals();
    });
  });
}

function clientTypeCheckboxesHtml(selected){
  return CLIENT_TYPES.map(t=>`
    <label class="checkbox-pill"><input type="checkbox" class="f-client-type" value="${t}" ${selected.includes(t)?'checked':''}>${t}</label>
  `).join('');
}
function selectHtml(cls, options, current, placeholder){
  return `<select class="${cls}">
    ${placeholder ? `<option value="" ${!current?'selected':''}>${placeholder}</option>` : ''}
    ${options.map(o=>`<option value="${o}" ${current===o?'selected':''}>${o}</option>`).join('')}
  </select>`;
}

function wireNewCardEvents(){
  const list = document.getElementById('list');
  const cancelBtn = list.querySelector('[data-new-cancel]');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ addingNew = false; newLeadPrefill = null; render(); });
  const saveBtn = list.querySelector('[data-new-save]');
  if(saveBtn){
    saveBtn.addEventListener('click', async ()=>{
      const card = list.querySelector('.card[data-mls="__new__"]');
      const address = card.querySelector('.f-new-address').value.trim();
      if(!address){ showToast('Address (or lead note) is required', true); return; }
      let mls = card.querySelector('.f-new-mls').value.trim();
      if(!mls) mls = `LEAD-${Date.now()}`;
      const clientTypes = Array.from(card.querySelectorAll('.f-client-type:checked')).map(cb=>cb.value);
      const newRecord = {
        mls_number: mls,
        address,
        city: card.querySelector('.f-new-city').value.trim(),
        role: card.querySelector('.f-new-role').value,
        sold_date: card.querySelector('.f-new-solddate').value.trim(),
        lease_end_date: card.querySelector('.f-new-leaseend').value.trim(),
        owner1_name: card.querySelector('.f-o1-name').value.trim(),
        owner1_email: card.querySelector('.f-o1-email').value.trim(),
        owner1_phone: card.querySelector('.f-o1-phone').value.trim(),
        owner1_birthday: card.querySelector('.f-o1-bday').value.trim(),
        owner2_name: card.querySelector('.f-o2-name').value.trim(),
        owner2_email: card.querySelector('.f-o2-email').value.trim(),
        owner2_phone: card.querySelector('.f-o2-phone').value.trim(),
        owner2_birthday: card.querySelector('.f-o2-bday').value.trim(),
        client_info_status: card.querySelector('.f-info-status').value,
        relationship_status: card.querySelector('.f-relationship').value,
        client_type: clientTypes,
        assigned_agent: card.querySelector('.f-assigned-agent').value,
        referred_by: card.querySelector('.f-referred-by').value.trim(),
        property_status: card.querySelector('.f-prop-status').value,
        next_follow_up_date: isoToMmddyyyy(card.querySelector('.f-next-followup').value),
        follow_up_reason: card.querySelector('.f-followup-reason').value.trim(),
        client_note: card.querySelector('.f-note').value.trim(),
        client_status: 'NO_RESEARCH',
        updated_at: new Date().toISOString()
      };
      newRecord.client_name = newRecord.owner1_name + (newRecord.owner2_name ? ` & ${newRecord.owner2_name}` : '');
      newRecord.client_email = [newRecord.owner1_email, newRecord.owner2_email].filter(Boolean).join('; ');

      saveBtn.disabled = true; saveBtn.textContent = 'Adding…';
      const { error } = await sb.from(TABLE).insert(newRecord);
      if(error){ showToast('Could not add — please try again', true); saveBtn.disabled=false; saveBtn.textContent='Add to Dashboard'; return; }
      records.unshift(newRecord);
      await addActivityLogEntry(mls, {activity_type:'Record Created', description: newRecord.referred_by ? `New referral lead created — referred by ${newRecord.referred_by}.` : 'New client/property record created.', related_property: address});
      addingNew = false;
      newLeadPrefill = null;
      updateStats();
      renderUpcoming();
      renderMainView();
      showToast('Added — now visible to everyone viewing this page');
    });
  }
}

function wireEditCardEvents(){
  const list = document.getElementById('list');
  const cancelBtn = list.querySelector('[data-cancel]');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editingMls = null; render(); });

  const overrideBox = list.querySelector('.f-info-override');
  if(overrideBox){
    overrideBox.addEventListener('change', ()=>{
      const sel = list.querySelector('.f-info-status');
      const hint = list.querySelector('#autoStatusHint');
      sel.disabled = !overrideBox.checked;
      if(!overrideBox.checked){
        const r = records.find(x=>x.mls_number===editingMls);
        const draft = { ...r,
          owner1_name: list.querySelector('.f-o1-name').value.trim(),
          owner1_email: list.querySelector('.f-o1-email').value.trim(),
          owner1_phone: list.querySelector('.f-o1-phone').value.trim(),
          owner2_email: list.querySelector('.f-o2-email').value.trim(),
          owner2_phone: list.querySelector('.f-o2-phone').value.trim(),
          relationship_status: list.querySelector('.f-relationship').value,
          client_type: Array.from(list.querySelectorAll('.f-client-type:checked')).map(cb=>cb.value)
        };
        const auto = computeAutoInfoStatus(draft);
        sel.value = auto;
        hint.textContent = `Auto-computed from the fields above: ${auto}.`;
      } else {
        hint.textContent = 'Manually overridden.';
      }
    });
  }

  const logAddBtn = list.querySelector('[data-log-add]');
  if(logAddBtn){
    logAddBtn.addEventListener('click', async ()=>{
      const mls = logAddBtn.dataset.logAdd;
      const type = list.querySelector('.f-log-type').value;
      const desc = list.querySelector('.f-log-desc').value.trim();
      const followup = isoToMmddyyyy(list.querySelector('.f-log-followup').value);
      if(!desc){ showToast('Add a short description before logging', true); return; }
      const r = records.find(x=>x.mls_number===mls);
      const updates = {};
      if(CONTACT_ACTIVITY_TYPES.includes(type)) updates.last_contact_date = fmtDateSlash(new Date());
      if(followup) updates.next_follow_up_date = followup;
      if(Object.keys(updates).length){
        updates.updated_at = new Date().toISOString();
        await sb.from(TABLE).update(updates).eq('mls_number', mls);
        if(r) Object.assign(r, updates);
      }
      await addActivityLogEntry(mls, {activity_type:type, description:desc, related_property: r?r.address:'', follow_up_date: followup});
      showToast('Activity logged');
      render();
    });
  }

  const saveBtn = list.querySelector('[data-save]');
  if(saveBtn){
    saveBtn.addEventListener('click', async ()=>{
      const card = list.querySelector('.card.editing');
      const mls = saveBtn.dataset.save;
      const r = records.find(x=>x.mls_number===mls);
      const prevInfoStatus = r.client_info_status, prevRelationship = r.relationship_status, prevPropStatus = r.property_status;

      const clientTypes = Array.from(card.querySelectorAll('.f-client-type:checked')).map(cb=>cb.value);
      const overridden = card.querySelector('.f-info-override').checked;
      const updates = {
        owner1_name: card.querySelector('.f-o1-name').value.trim(),
        owner1_email: card.querySelector('.f-o1-email').value.trim(),
        owner1_phone: card.querySelector('.f-o1-phone').value.trim(),
        owner1_birthday: card.querySelector('.f-o1-bday').value.trim(),
        owner2_name: card.querySelector('.f-o2-name').value.trim(),
        owner2_email: card.querySelector('.f-o2-email').value.trim(),
        owner2_phone: card.querySelector('.f-o2-phone').value.trim(),
        owner2_birthday: card.querySelector('.f-o2-bday').value.trim(),
        relationship_status: card.querySelector('.f-relationship').value,
        client_type: clientTypes,
        assigned_agent: card.querySelector('.f-assigned-agent').value,

        property_status: card.querySelector('.f-prop-status').value,
        last_contact_date: isoToMmddyyyy(card.querySelector('.f-last-contact').value),

        follow_up_reason: card.querySelector('.f-followup-reason').value.trim(),
        follow_up_status_override: card.querySelector('.f-followup-override').value,
        annual_review_status: card.querySelector('.f-review-status').value,
        annual_review_last_date: isoToMmddyyyy(card.querySelector('.f-review-last').value),
        annual_review_next_date: isoToMmddyyyy(card.querySelector('.f-review-next').value),
        comparable_sales_link: card.querySelector('.f-comps-link').value.trim(),
        printable_report_link: card.querySelector('.f-report-link').value.trim(),
        client_note: card.querySelector('.f-note').value.trim(),
        client_info_status_overridden: overridden,
        updated_at: new Date().toISOString()
      };
      const estVal = card.querySelector('.f-est-value').value.trim();
      const origVal = card.querySelector('.f-orig-price').value.trim();
      updates.estimated_current_value = estVal ? Number(estVal.replace(/[^0-9.-]/g,'')) : null;
      updates.original_purchase_price = origVal ? Number(origVal.replace(/[^0-9.-]/g,'')) : null;

      updates.client_info_status = overridden
        ? card.querySelector('.f-info-status').value
        : computeAutoInfoStatus({...updates});

      const leaseStartEl = card.querySelector('.f-lease-start');
      const leaseEndEl = card.querySelector('.f-lease-end');
      if(leaseStartEl) updates.sold_date = leaseStartEl.value.trim();
      if(leaseEndEl) updates.lease_end_date = leaseEndEl.value.trim();
      updates.client_name = updates.owner1_name + (updates.owner2_name ? ` & ${updates.owner2_name}` : '');
      updates.client_email = [updates.owner1_email, updates.owner2_email].filter(Boolean).join('; ');

      const finishSave = async ()=>{
        saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
        const { error } = await sb.from(TABLE).update(updates).eq('mls_number', mls);
        if(error){ showToast('Could not save — please try again', true); saveBtn.disabled=false; saveBtn.textContent='Save Changes'; return; }
        Object.assign(r, updates);

        if(updates.client_info_status !== prevInfoStatus){
          await addActivityLogEntry(mls, {activity_type:'Status Changed', description: overridden ? 'Client Information Status manually overridden.' : 'Client Information Status changed.', related_property:r.address, previous_value: prevInfoStatus, new_value: updates.client_info_status});
        }
        if(updates.relationship_status !== prevRelationship){
          await addActivityLogEntry(mls, {activity_type:'Status Changed', description:'Relationship Status changed.', related_property:r.address, previous_value: prevRelationship, new_value: updates.relationship_status});
        }
        if(updates.property_status !== prevPropStatus){
          await addActivityLogEntry(mls, {activity_type:'Property Ownership Updated', description:'Property Status changed.', related_property:r.address, previous_value: prevPropStatus, new_value: updates.property_status});
        }

        const confirmEl = document.getElementById(`saveConfirm-${mls}`);
        if(confirmEl) confirmEl.classList.add('show');
        updateStats();
        renderUpcoming();
        render();
        showToast('Saved — everyone viewing this page now sees the update');
      };

      // Active Client Logic: ask before flipping Active Client -> Past Client on a closing transaction
      const closingStatuses = ['Purchased','Sold','Leased'];
      if(prevRelationship === 'Active Client' && closingStatuses.includes(updates.property_status) && updates.property_status !== prevPropStatus){
        showConfirmModal(
          'Move to Past Client?',
          `This property status is changing to "${updates.property_status}" — the transaction appears to have closed. Change Relationship Status from Active Client to Past Client?`,
          'Yes, Move to Past Client',
          async (confirmed)=>{
            if(confirmed) updates.relationship_status = 'Past Client';
            await finishSave();
          }
        );
      } else {
        await finishSave();
      }
    });
  }
}
