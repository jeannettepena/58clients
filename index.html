const CSV_COLUMNS = ['mls_number','address','city','category_mls','transaction_type','represented','role','sold_year','list_price','sold_price','list_date','sold_date','dom',
  'client_info_status','relationship_status','assigned_agent','referred_by','property_status','client_note',
  'owner1_name','owner1_email','owner1_phone','owner1_birthday','owner2_name','owner2_email','owner2_phone','owner2_birthday','lease_end_date',
  'last_contact_date','next_follow_up_date','follow_up_reason',
  'annual_review_status','annual_review_last_date','annual_review_next_date','estimated_current_value','original_purchase_price'];

function csvEscape(val){
  const s = val==null ? '' : String(val);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function exportCsv(){
  const rows = [CSV_COLUMNS.join(',')];
  records.forEach(r=>{
    rows.push(CSV_COLUMNS.map(col=> csvEscape(col==='client_type' ? typeArr(r).join('|') : r[col])).join(','));
  });
  const csv = rows.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `properties-clients-export-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`Exported ${records.length} records to CSV`);
}

function parseCsvText(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length===1 && r[0] !== ''));
}

async function importCsvFile(file){
  const text = await file.text();
  const rows = parseCsvText(text);
  if(rows.length < 2){ showToast('CSV appears to be empty', true); return; }
  const headers = rows[0].map(h=>h.trim());
  const dataRows = rows.slice(1);
  const numericCols = new Set(['sold_year','list_price','sold_price','dom','estimated_current_value','original_purchase_price']);
  const payload = dataRows.map(cols=>{
    const obj = {};
    headers.forEach((h,i)=>{
      if(!CSV_COLUMNS.includes(h)) return;
      let v = cols[i] !== undefined ? cols[i] : '';
      obj[h] = numericCols.has(h) ? (v === '' ? null : Number(v)) : v;
    });
    return obj;
  }).filter(o => o.mls_number);

  if(!payload.length){ showToast('No valid rows found (need an mls_number column)', true); return; }

  showToast(`Importing ${payload.length} rows…`);
  const BATCH = 50;
  let imported = 0, failed = 0;
  for(let i=0; i<payload.length; i+=BATCH){
    const batch = payload.slice(i, i+BATCH);
    const { error } = await sb.from(TABLE).upsert(batch, {onConflict:'mls_number'});
    if(error) failed += batch.length; else imported += batch.length;
  }
  showToast(failed ? `Imported ${imported} rows, ${failed} failed` : `Imported ${imported} rows successfully`, !!failed);
  await loadData();
}

function groupClients(recs){
  const groups = new Map();
  recs.forEach(r => {
    // Group by email first, then by normalized name
    const key = r.owner1_email?.toLowerCase().trim() || 
                r.owner1_name?.toLowerCase().trim().replace(/\s+/g,' ') || 
                r.mls_number;
    if(!groups.has(key)){
      groups.set(key, { key, name: r.owner1_name||r.address||'—', email: r.owner1_email||'', phone: r.owner1_phone||'', properties: [] });
    }
    groups.get(key).properties.push(r);
  });
  // Sort each group's properties by date desc
  groups.forEach(g => {
    g.properties.sort((a,b) => {
      const da = a.sold_date ? new Date(a.sold_date) : new Date(0);
      const db = b.sold_date ? new Date(b.sold_date) : new Date(0);
      return db - da;
    });
  });
  return Array.from(groups.values()).sort((a,b) => a.name.localeCompare(b.name));
}

function renderGrouped(list){
  const groups = groupClients(list);
  const el = document.getElementById('list');
  if(!groups.length){
    el.innerHTML = '<div class="empty-state"><h3>No clients found</h3><p>Try a different search or filter.</p></div>';
    return;
  }
  window._cgGroups = groups;
  const html = ['<div class="client-grid">'];
  groups.forEach(function(g, gIdx){
    const propCount = g.properties.length;
    const latest = g.properties[0];
    const relStatus = latest ? (latest.relationship_status||'') : '';
    const statusClass = relStatus==='Active Client'?'status-active':relStatus==='Past Client'?'status-past':'status-prospect';
    const hasAnniv = g.properties.some(function(p){
      if(!p.sold_date) return false;
      const d = parseDate(p.sold_date); if(!d) return false;
      const anniv = new Date(todayDate().getFullYear(), d.getMonth(), d.getDate());
      if(anniv < todayDate()) anniv.setFullYear(todayDate().getFullYear()+1);
      return Math.round((anniv - todayDate())/86400000) <= 30;
    });
    const hasLeaseAlert = g.properties.some(function(p){
      if(!p.lease_end_date) return false;
      const d = parseDate(p.lease_end_date); if(!d) return false;
      return Math.round((d - todayDate())/86400000) <= 60;
    });
    html.push('<div class="client-group" id="cg-' + gIdx + '">');
    html.push('<div class="client-group-head">');
    html.push('<div style="flex:1;min-width:0;">');
    html.push('<div class="cg-name">' + escapeHtml(g.name) + '</div>');
    if(g.email || g.phone){
      html.push('<div class="cg-meta" style="margin-top:3px;">' + escapeHtml([g.email,g.phone].filter(Boolean).join(' · ')) + '</div>');
    }
    html.push('<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;">');
    if(relStatus) html.push('<span class="cc-status ' + statusClass + '" style="font-size:9px;padding:2px 8px;">' + escapeHtml(relStatus) + '</span>');
    html.push('<span class="cg-count">' + propCount + ' ' + (propCount===1?'property':'properties') + '</span>');

    if(hasLeaseAlert) html.push('<span style="font-size:9px;padding:2px 8px;border-radius:20px;background:#FFEBEE;color:#C62828;font-weight:500;">Lease alert</span>');
    html.push('</div>');
    html.push('</div>');
    html.push('<button onclick="openClientDrawerWithGroup(window._cgGroups[' + gIdx + '])" style="font-size:10px;padding:4px 14px;border-radius:20px;border:none;background:var(--navy);color:var(--champ);cursor:pointer;font-family:Jost,sans-serif;font-weight:500;flex-shrink:0;">View</button>');
    html.push('</div>'); // end head
    html.push('</div>'); // end client-group
  });
  html.push('</div>');
  el.innerHTML = html.join('');

  // Wire clicks after render
  groups.forEach(function(g, gIdx){
    var card = document.getElementById('cg-' + gIdx);
    if(!card) return;
    card.addEventListener('click', function(e){
      if(e.target.closest('button')) return;
      openClientDrawerWithGroup(window._cgGroups[gIdx]);
    });
  });
}

    renderUpcoming();
    renderMainView();
    showToast('Added successfully');
  });
}


// ── CLIENT PROFILE DRAWER ─────────────────────────────
function openClientDrawerByIdx(idx){
  const group = _lastGroups[idx];
  if(!group){ console.warn('No group at index', idx, _lastGroups); return; }
  openClientDrawerWithGroup(group);
}

function openClientDrawer(groupKey){
  const group = groupClients(records).find(g => g.key === decodeURIComponent(groupKey));
  if(!group) return;
  openClientDrawerWithGroup(group);
}

function openClientDrawerWithGroup(group){
  if(!group){alert("No group data");return;}
  document.getElementById('clientDrawerBadge').textContent = group.properties.length + ' ' + (group.properties.length === 1 ? 'property' : 'properties');
  document.getElementById('clientDrawerName').textContent = group.name;
  document.getElementById('clientDrawerSub').textContent = [group.email, group.phone].filter(Boolean).join(' · ') || 'No contact info';
  document.getElementById('clientDrawerBody').innerHTML = buildClientProfile(group);
  document.getElementById('clientDrawer').classList.add('open');
  document.getElementById('clientOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeClientDrawer(){
  document.getElementById('clientDrawer').classList.remove('open');
  document.getElementById('clientOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function buildClientProfile(group){
  const today = todayDate();
  const rows = group.properties.map(p => {
    const isLease = p.transaction_type?.toLowerCase().includes('rent') || isRentalRole(p.role);
    const closeDate = p.sold_date ? parseDate(p.sold_date) : null;
    const leaseEnd = p.lease_end_date ? parseDate(p.lease_end_date) : null;

    // Anniversary
    let anniversaryHtml = '';
    if(closeDate && !isLease){
      const annivThisYear = new Date(today.getFullYear(), closeDate.getMonth(), closeDate.getDate());
      const annivNext = annivThisYear < today ? new Date(today.getFullYear()+1, closeDate.getMonth(), closeDate.getDate()) : annivThisYear;
      const days = Math.round((annivNext - today) / 86400000);
      const label = days === 0 ? 'Today!' : days <= 30 ? `in ${days} days` : annivNext.toLocaleDateString('en-US',{month:'short',day:'numeric'});
      const urgent = days <= 30;
      anniversaryHtml = `<div style="font-size:10px;margin-top:3px;color:${urgent?'var(--champ)':'var(--ink4)'};">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:3px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Anniversary ${label}${urgent?' ·':''} ${today.getFullYear() - closeDate.getFullYear()} yr${today.getFullYear() - closeDate.getFullYear() !== 1 ? 's' : ''}
      </div>`;
    }

    // Lease status
    let leaseHtml = '';
    if(isLease && leaseEnd){
      const days = Math.round((leaseEnd - today) / 86400000);
      const expired = days < 0;
      const urgent = days >= 0 && days <= 60;
      const label = expired ? `Expired ${Math.abs(days)} days ago` : days === 0 ? 'Expires today!' : `Expires in ${days} days`;
      leaseHtml = `<div style="font-size:10px;margin-top:3px;color:${expired?'#C24A3B':urgent?'var(--champ)':'var(--ink4)'};">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:3px;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        ${label}
      </div>`;
    }

    const dotColor = isLease ? 'var(--champ-2)' : 'var(--teal)';
    const typeLabel = isLease ? 'Lease' : 'Sale';
    const dateStr = isLease 
      ? (p.sold_date ? `Started ${p.sold_date}` : '') 
      : (p.sold_date ? `Closed ${p.sold_date}` : '');

    return `<div style="padding:12px 0;border-bottom:1px solid var(--border);">
      <div style="display:flex;align-items:flex-start;gap:10px;">
        <div style="width:6px;height:6px;border-radius:50%;background:${dotColor};flex-shrink:0;margin-top:6px;"></div>
        <div style="flex:1;">
          <div style="font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--navy);">${escapeHtml(p.address||'—')}</div>
          <div style="font-size:11px;color:var(--ink3);margin-top:1px;">${escapeHtml(p.city||'')}${p.city&&dateStr?' · ':''}${escapeHtml(dateStr)} · <span style="color:var(--ink4)">${typeLabel}</span>${p.sale_price?' · '+escapeHtml(p.sale_price):''}</div>
          ${anniversaryHtml}
          ${leaseHtml}
        </div>
        <button onclick="closeClientDrawer();setTimeout(()=>openEditDrawer('${escapeHtml(p.mls_number)}'),300)" 
          style="font-size:10px;padding:3px 10px;border-radius:20px;border:none;background:var(--navy);color:var(--champ);cursor:pointer;font-family:'Jost',sans-serif;font-weight:500;flex-shrink:0;">Edit</button>
      </div>
    </div>`;
  }).join('');

  // Upcoming alerts
  const alerts = [];
  group.properties.forEach(p => {
    const isLease = p.transaction_type?.toLowerCase().includes('rent') || isRentalRole(p.role);
    if(!isLease && p.sold_date){
      const d = parseDate(p.sold_date);
      if(d){
        const anniv = new Date(today.getFullYear(), d.getMonth(), d.getDate());
        if(anniv < today) anniv.setFullYear(today.getFullYear()+1);
        const days = Math.round((anniv - today)/86400000);
        if(days <= 60) alerts.push(`Anniversary for ${escapeHtml(p.address||'—')} in ${days} days`);
      }
    }
    if(isLease && p.lease_end_date){
      const d = parseDate(p.lease_end_date);
      if(d){
        const days = Math.round((d - today)/86400000);
        if(days <= 90) alerts.push(`${days < 0 ? 'Expired' : 'Lease expires'} ${escapeHtml(p.address||'—')} ${days < 0 ? Math.abs(days)+' days ago' : 'in '+days+' days'}`);
      }
    }
  });

  const alertsHtml = alerts.length ? `
    <div class="drawer-section" style="background:var(--champ-wash);border-radius:8px;padding:12px 16px;margin-bottom:4px;">
      <div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);font-weight:500;margin-bottom:8px;font-family:'Jost',sans-serif;">Upcoming</div>
      ${alerts.map(a=>`<div style="font-size:12px;color:var(--navy);padding:3px 0;font-family:'Jost',sans-serif;">· ${a}</div>`).join('')}
    </div>` : '';

  const followHtml = '';

  // Contact info section
  const contactInfo = group.properties[0];
  const contactHtml = `
    <div class="drawer-section" style="margin-bottom:16px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        ${group.email ? `<div><div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink4);font-family:'Jost',sans-serif;margin-bottom:3px;">Email</div><div style="font-size:13px;color:var(--ink);font-family:'Jost',sans-serif;">${escapeHtml(group.email)}</div></div>` : ''}
        ${group.phone ? `<div><div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink4);font-family:'Jost',sans-serif;margin-bottom:3px;">Phone</div><div style="font-size:13px;color:var(--ink);font-family:'Jost',sans-serif;">${escapeHtml(group.phone)}</div></div>` : ''}
        ${contactInfo?.owner1_birthday ? `<div><div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink4);font-family:'Jost',sans-serif;margin-bottom:3px;">Birthday</div><div style="font-size:13px;color:var(--ink);font-family:'Jost',sans-serif;">${escapeHtml(contactInfo.owner1_birthday)}</div></div>` : ''}
        ${contactInfo?.relationship_status ? `<div><div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink4);font-family:'Jost',sans-serif;margin-bottom:3px;">Status</div><div style="font-size:13px;color:var(--ink);font-family:'Jost',sans-serif;">${escapeHtml(contactInfo.relationship_status)}</div></div>` : ''}
        ${contactInfo?.next_follow_up_date ? `<div style="grid-column:span 2"><div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink4);font-family:'Jost',sans-serif;margin-bottom:3px;">Next Follow-Up</div><div style="font-size:13px;color:var(--champ);font-family:'Jost',sans-serif;font-weight:500;">${escapeHtml(contactInfo.next_follow_up_date)}</div></div>` : ''}
        ${contactInfo?.client_note ? `<div style="grid-column:span 2"><div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink4);font-family:'Jost',sans-serif;margin-bottom:3px;">Note</div><div style="font-size:12px;color:var(--ink3);font-style:italic;font-family:'Cormorant Garamond',serif;font-size:14px;">${escapeHtml(contactInfo.client_note)}</div></div>` : ''}
      </div>
    </div>`;

  return `
    <div style="padding:0 0 20px;">
      ${contactHtml}
      ${alertsHtml}
      <div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:500;margin-bottom:4px;font-family:'Jost',sans-serif;">Property History</div>
      ${rows}
    </div>
  `;
}

// ── EDIT DRAWER ────────────────────────────────────────
function openEditDrawer(mls){
  const r = records.find(x => x.mls_number === mls);
  if(!r) return;
  document.getElementById('drawerBadge').textContent = r.transaction_type || 'Client';
  document.getElementById('drawerName').textContent = r.owner1_name || r.address || '—';
  document.getElementById('drawerSub').textContent = (r.address||'') + (r.city?' · '+r.city:'') + (r.sold_date?' · Closed '+r.sold_date:'');
  document.getElementById('drawerBody').innerHTML = buildDrawerForm(r);
  document.getElementById('editDrawer').classList.add('open');
  document.getElementById('editOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeEditDrawer(){
  document.getElementById('editDrawer').classList.remove('open');
  document.getElementById('editOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function buildDrawerForm(r){
  const selectOpts = (arr, val) => ['', ...arr].map(o => `<option value="${o}" ${o===val?'selected':''}>${o||'—'}</option>`).join('');
  const mailingIsSame = !r.mailing_address || r.mailing_address === r.address;
  return `
    <div class="drawer-section">
      <div class="drawer-section-title">Client 1</div>
      <div class="drawer-grid">
        <div class="drawer-field"><label>Name</label><input class="f-o1-name" value="${escapeHtml(r.owner1_name||'')}"></div>
        <div class="drawer-field"><label>Birthday (MM/DD)</label><input class="f-o1-bday" value="${escapeHtml(r.owner1_birthday||'')}" placeholder="MM/DD"></div>
        <div class="drawer-field"><label>Email</label><input class="f-o1-email" value="${escapeHtml(r.owner1_email||'')}"></div>
        <div class="drawer-field"><label>Phone</label><input class="f-o1-phone" value="${escapeHtml(r.owner1_phone||'')}"></div>
      </div>
    </div>
    <div class="drawer-section">
      <div class="drawer-section-title">Client 2</div>
      <div class="drawer-grid">
        <div class="drawer-field"><label>Name</label><input class="f-o2-name" value="${escapeHtml(r.owner2_name||'')}"></div>
        <div class="drawer-field"><label>Birthday (MM/DD)</label><input class="f-o2-bday" value="${escapeHtml(r.owner2_birthday||'')}" placeholder="MM/DD"></div>
        <div class="drawer-field"><label>Email</label><input class="f-o2-email" value="${escapeHtml(r.owner2_email||'')}"></div>
        <div class="drawer-field"><label>Phone</label><input class="f-o2-phone" value="${escapeHtml(r.owner2_phone||'')}"></div>
      </div>
    </div>
    <div class="drawer-section">
      <div class="drawer-section-title">Status & Relationship</div>
      <div class="drawer-grid">
        <div class="drawer-field"><label>Relationship Status</label><select class="f-rel-status"><option value="">—</option>${selectOpts(RELATIONSHIP_STATUSES, r.relationship_status)}</select></div>
        <div class="drawer-field"><label>Next Follow-Up</label><input class="f-followup" type="date" value="${escapeHtml(r.next_follow_up_date||'')}"></div>
        <div class="drawer-field" style="grid-column:span 2"><label>Client Note</label><textarea class="f-client-note" rows="2" style="resize:none;">${escapeHtml(r.client_note||'')}</textarea></div>
      </div>
    </div>
    <div class="drawer-section">
      <div class="drawer-section-title">Property</div>
      <div class="drawer-grid">
        <div class="drawer-field"><label>Address</label><input class="f-address" value="${escapeHtml(r.address||'')}"></div>
        <div class="drawer-field"><label>City</label><input class="f-city" value="${escapeHtml(r.city||'')}"></div>
        <div class="drawer-field"><label>Transaction Type</label><input class="f-txn-type" value="${escapeHtml(r.transaction_type||'')}"></div>
        <div class="drawer-field"><label>Sold / Closed Date</label><input class="f-sold-date" value="${escapeHtml(r.sold_date||'')}"></div>
        <div class="drawer-field"><label>Sale Price</label><input class="f-sale-price" value="${escapeHtml(r.sale_price||'')}"></div>
        <div class="drawer-field"><label>Property Status</label><select class="f-prop-status"><option value="">—</option>${selectOpts(PROPERTY_STATUSES, r.property_status)}</select></div>
      </div>
    </div>
    <div class="drawer-section">
      <div class="drawer-section-title">Mailing Address</div>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-family:'Jost',sans-serif;font-size:12px;color:var(--ink3);margin-bottom:12px;">
        <input type="checkbox" id="mailingIsSame" ${mailingIsSame?'checked':''}
          onchange="document.getElementById('mailingFields').style.display=this.checked?'none':'grid'"
          style="accent-color:var(--champ);width:15px;height:15px;cursor:pointer;">
        Same as property address
      </label>
      <div id="mailingFields" class="drawer-grid" style="display:${mailingIsSame?'none':'grid'}">
        <div class="drawer-field" style="grid-column:span 2"><label>Street</label><input class="f-mailing-address" value="${escapeHtml(r.mailing_address||'')}"></div>
        <div class="drawer-field"><label>City</label><input class="f-mailing-city" value="${escapeHtml(r.mailing_city||'')}"></div>
        <div class="drawer-field"><label>State</label><input class="f-mailing-state" value="${escapeHtml(r.mailing_state||'TX')}" placeholder="TX"></div>
        <div class="drawer-field"><label>ZIP</label><input class="f-mailing-zip" value="${escapeHtml(r.mailing_zip||'')}"></div>
      </div>
    </div>
    <div class="drawer-actions">
      <button onclick="saveDrawer('${escapeHtml(r.mls_number)}')" style="font-family:'Jost',sans-serif;font-size:12px;font-weight:500;letter-spacing:.06em;padding:9px 28px;border-radius:30px;border:none;background:var(--navy);color:var(--champ);cursor:pointer;flex:1;transition:all .2s;" onmouseover="this.style.background='var(--champ)';this.style.color='var(--navy)'" onmouseout="this.style.background='var(--navy)';this.style.color='var(--champ)'">Save</button>
      <button onclick="closeEditDrawer()" style="font-family:'Jost',sans-serif;font-size:12px;padding:9px 20px;border-radius:30px;border:1px solid var(--border);background:transparent;color:var(--ink3);cursor:pointer;">Cancel</button>
    </div>
  `;
}

async function saveDrawer(mls){
  const r = records.find(x => x.mls_number === mls);
  if(!r) return;
  const d = document.getElementById('drawerBody');
  const same = d.querySelector('#mailingIsSame')?.checked;
  const updates = {
    owner1_name: d.querySelector('.f-o1-name')?.value?.trim()||null,
    owner1_email: d.querySelector('.f-o1-email')?.value?.trim()||null,
    owner1_phone: d.querySelector('.f-o1-phone')?.value?.trim()||null,
    owner1_birthday: d.querySelector('.f-o1-bday')?.value?.trim()||null,
    owner2_name: d.querySelector('.f-o2-name')?.value?.trim()||null,
    owner2_email: d.querySelector('.f-o2-email')?.value?.trim()||null,
    owner2_phone: d.querySelector('.f-o2-phone')?.value?.trim()||null,
    owner2_birthday: d.querySelector('.f-o2-bday')?.value?.trim()||null,
    relationship_status: d.querySelector('.f-rel-status')?.value||null,
    next_follow_up_date: d.querySelector('.f-followup')?.value||null,
    client_note: d.querySelector('.f-client-note')?.value?.trim()||null,
    address: d.querySelector('.f-address')?.value?.trim()||null,
    city: d.querySelector('.f-city')?.value?.trim()||null,
    transaction_type: d.querySelector('.f-txn-type')?.value?.trim()||null,
    sold_date: d.querySelector('.f-sold-date')?.value?.trim()||null,
    sale_price: d.querySelector('.f-sale-price')?.value?.trim()||null,
    property_status: d.querySelector('.f-prop-status')?.value||null,
    mailing_address: same ? null : (d.querySelector('.f-mailing-address')?.value?.trim()||null),
    mailing_city: same ? null : (d.querySelector('.f-mailing-city')?.value?.trim()||null),
    mailing_state: same ? null : (d.querySelector('.f-mailing-state')?.value?.trim()||null),
    mailing_zip: same ? null : (d.querySelector('.f-mailing-zip')?.value?.trim()||null),
    updated_at: new Date().toISOString(),
  };
  Object.assign(r, updates);
  const { error } = await sb.from(TABLE).update(updates).eq('mls_number', mls);
  if(!error){ closeEditDrawer(); render(); }
  else { alert('Error saving — check console'); console.error(error); }
}
</script>
